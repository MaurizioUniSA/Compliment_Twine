<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Complement System — Interactive Pathway Learning Activity</title>
<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: #f4f5f9;
    color: #1a1a2e;
    font-size: clamp(15px, 2vw, 17px);
    line-height: 1.75;
    min-height: 100vh;
}

#story {
    max-width: 760px;
    margin: 0 auto;
    padding: 1.5rem 1rem 4rem;
}

.passage {
    background: #ffffff;
    border-radius: 14px;
    padding: 2rem 2.25rem;
    box-shadow: 0 2px 16px rgba(30,40,100,0.08);
    border: 1px solid #e4e8f0;
    animation: fadeSlide 0.3s ease;
}
@keyframes fadeSlide {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
}

h1 {
    font-size: 1.65rem;
    font-weight: 700;
    color: #1a1a2e;
    margin-bottom: 1rem;
    line-height: 1.25;
}
h2 {
    font-size: 1.2rem;
    font-weight: 600;
    color: #1e2d7a;
    margin-bottom: 0.85rem;
    padding-bottom: 0.4rem;
    border-bottom: 2px solid #eaecf8;
}
h3 {
    font-size: 1.05rem;
    font-weight: 600;
    color: #2d3a8c;
    margin-bottom: 0.6rem;
}

p {
    margin-bottom: 0.9rem;
}
p:last-child { margin-bottom: 0; }

a.link-internal {
    display: block;
    background: #f0f3ff;
    border: 1.5px solid #c8d1fa;
    border-radius: 9px;
    padding: 0.65rem 1.1rem;
    margin: 0.45rem 0;
    color: #1e2d7a;
    font-weight: 500;
    text-decoration: none;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    cursor: pointer;
}
a.link-internal:hover {
    background: #dce3ff;
    border-color: #7c8fee;
    transform: translateX(3px);
    text-decoration: none;
    color: #111e6e;
}
a.link-internal:active {
    background: #c7d0f9;
    transform: translateX(1px);
}

.feedback-correct {
    background: #f0fbf4;
    border-left: 4px solid #27a85f;
    border-radius: 0 9px 9px 0;
    padding: 0.8rem 1rem;
    margin: 0.5rem 0 1rem;
    color: #14472e;
}
.feedback-incorrect {
    background: #fff4f0;
    border-left: 4px solid #e05a2b;
    border-radius: 0 9px 9px 0;
    padding: 0.8rem 1rem;
    margin: 0.5rem 0 1rem;
    color: #5c2010;
}

.key-box {
    background: #fafbff;
    border: 1px solid #d4daf7;
    border-radius: 9px;
    padding: 0.8rem 1rem;
    margin: 0.8rem 0;
    font-size: 0.95rem;
    line-height: 1.65;
}
.key-box strong { color: #1e2d7a; }

.progress-label {
    font-size: 0.78rem;
    color: #777;
    margin-bottom: 0.3rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}
.progress-bar {
    background: #e8eaf0;
    border-radius: 99px;
    height: 5px;
    margin-bottom: 1.25rem;
    overflow: hidden;
}
.progress-fill {
    background: linear-gradient(90deg, #4a6cf7, #7c8fee);
    height: 100%;
    border-radius: 99px;
}

.section-label {
    display: inline-block;
    border-radius: 99px;
    padding: 0.18rem 0.75rem;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 0.75rem;
    background: #e8eaf0;
    color: #444;
}
.section-label.classical   { background: #e6f0ff; color: #0a4d8f; }
.section-label.alternative { background: #e6fff0; color: #0a5c35; }
.section-label.lectin      { background: #fff8e6; color: #7a4800; }
.section-label.shared      { background: #f5e6ff; color: #5b0a8a; }
.section-label.regulation  { background: #fff3e0; color: #7a3800; }
.section-label.clinical    { background: #e6f7ff; color: #006699; }

.clinical-table {
    width: 100%;
    border-collapse: collapse;
    margin: 1rem 0;
    font-size: 0.92rem;
}
.clinical-table th, .clinical-table td {
    border: 1px solid #d4daf7;
    padding: 0.6rem 0.8rem;
    text-align: left;
}
.clinical-table th {
    background: #fafbff;
    color: #1e2d7a;
    font-weight: 600;
}

.back-btn {
    display: inline-block;
    margin-top: 1.25rem;
    padding: 0.5rem 1rem;
    background: #f0f3ff;
    border: 1.5px solid #c8d1fa;
    border-radius: 9px;
    color: #1e2d7a;
    font-weight: 500;
    font-size: 0.92rem;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s, border-color 0.15s;
}
.back-btn:hover {
    background: #dce3ff;
    border-color: #7c8fee;
}

.mcq-link {
    display: block;
    margin-top: 0.5rem;
    padding: 0.65rem 1rem;
    background: #f0faf4;
    border: 1.5px solid #27a85f;
    border-radius: 9px;
    color: #0d4a2e;
    font-weight: 600;
    font-size: 0.97rem;
    text-decoration: none;
    transition: background 0.15s, border-color 0.15s;
}
.mcq-link:hover {
    background: #d4f0e2;
    border-color: #1a7a45;
}

/* ── Student ID Modal ─────────────────────────────────── */
#student-modal {
    position: fixed;
    inset: 0;
    background: rgba(20,30,80,0.82);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    backdrop-filter: blur(6px);
}
.modal-card {
    background: #fff;
    border-radius: 18px;
    padding: 2.6rem 2.2rem 2.2rem;
    max-width: 390px;
    width: 92%;
    text-align: center;
    box-shadow: 0 28px 80px rgba(0,0,0,0.32);
}
.modal-card h2 { margin:0 0 0.5rem; color:#1e2d7a; font-size:1.45rem; }
.modal-card p  { color:#556; font-size:0.95rem; margin:0 0 1.5rem; line-height:1.55; }
#sid-input {
    width:100%; box-sizing:border-box;
    font-size:2.4rem; text-align:center;
    letter-spacing:0.6em; padding:0.5rem 0.3rem;
    border:2.5px solid #c8d1fa; border-radius:10px;
    color:#1e2d7a; outline:none; margin-bottom:0.45rem;
    transition:border-color 0.15s; font-family:monospace;
}
#sid-input:focus { border-color:#5b6ef5; }
#sid-input.sid-error { border-color:#e74c3c; animation:shake 0.3s; }
@keyframes shake {
  0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)}
}
#sid-errtxt { color:#c0392b; font-size:0.85rem; min-height:1.3em; margin-bottom:0.75rem; }
#sid-btn {
    width:100%; padding:0.82rem;
    background:#3d52d5; color:white;
    border:none; border-radius:10px;
    font-size:1.05rem; font-weight:600;
    cursor:pointer; transition:background 0.15s; margin-top:0.3rem;
}
#sid-btn:hover { background:#2a3db8; }

/* ── Mobile table scroll ─────────────────────────────────── */
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: .8rem 0; }

/* ── Answer vs navigation link styles ────────────────── */
a.link-answer {
    background: #fafbff;
    border: 1.5px solid #c0c8f4;
    color: #2a3460;
    font-weight: 400;
    font-size: 0.96rem;
}
a.link-answer::before { content: "○ "; color: #9aa5e0; }
a.link-answer:hover {
    background: #edf0fc;
    border-color: #7c8fee;
    color: #1a2350;
}
a.link-continue {
    background: #1e2d7a;
    border: 1.5px solid #162060;
    color: #fff;
    font-weight: 600;
}
a.link-continue:hover {
    background: #2a3e9e;
    border-color: #1e2d7a;
    color: #fff;
    transform: translateX(3px);
}
a.link-continue:active { background: #152050; }

/* ── Accessible Notification Boxes ────────── */
.notice-box {
    background: #eef3ff;
    border: 1px solid #b6c6f5;
    border-radius: 9px;
    padding: .75rem 1rem;
    margin: .85rem 0;
    font-size: .94rem;
    color: #182663;
}
.notice-box strong { color: #0d1a4e; }

.warning-box {
    background: #fbf4e6;
    border: 1px solid #e6cb85;
    border-radius: 9px;
    padding: .75rem 1rem;
    margin: .85rem 0;
    font-size: .94rem;
    color: #3b2802;
}
.warning-box strong { color: #241801; }

/* ── Dark mode ──────────────────────────────────────────── */
@media (prefers-color-scheme: dark) {
    body         { background: #12131f; color: #d8daf0; }
    .passage     { background: #1e1f35; border-color: #2e3058; box-shadow: 0 2px 16px rgba(0,0,0,0.4); }
    h1           { color: #e0e3ff; }
    h2           { color: #9aadff; border-color: #2e3060; }
    h3           { color: #8a9dee; }
    .key-box     { background: #1a1b2e; border-color: #2e3060; }
    .key-box strong { color: #9aadff; }
    
    .notice-box  { background: #1a2245; border-color: #3a4b90; color: #d0dcff; }
    .notice-box strong { color: #ffffff; }
    .warning-box { background: #332810; border-color: #705820; color: #fde8b8; }
    .warning-box strong { color: #fff; }

    a.link-internal {
        background: #1e2045; border-color: #3a4580; color: #b0c0ff;
    }
    a.link-internal:hover { background: #2a2e5a; border-color: #6070d0; color: #c8d4ff; }
    a.link-answer { background: #181928; border-color: #2e3458; color: #9aa8d8; }
    a.link-answer:hover { background: #202245; }
    a.link-continue { background: #2e42b0; border-color: #3a52c8; }
    a.link-continue:hover { background: #3a52c8; }
    .back-btn    { background: #1e2045; border-color: #3a4580; color: #b0c0ff; }
    .back-btn:hover { background: #2a2e5a; }
    .feedback-correct { background: #0e2018; border-color: #27a85f; color: #6ee8a0; }
    .feedback-incorrect { background: #200e08; border-color: #e05a2b; color: #f0a080; }
    .section-label.classical   { background: #0a1a3a; color: #6090e0; }
    .section-label.alternative { background: #0a1e14; color: #60c890; }
    .section-label.lectin      { background: #1e1600; color: #e0a860; }
    .section-label.shared      { background: #1e0a30; color: #c070f0; }
    .section-label.regulation  { background: #1e1000; color: #d08040; }
    .section-label.clinical    { background: #001830; color: #50b0e0; }
    .progress-bar { background: #2a2c40; }
    .clinical-table th         { background: #1a1c30; color: #9aadff; }
    .clinical-table th, .clinical-table td { border-color: #2e3060; }
    .modal-card { background: #1e1f35; color: #d8daf0; }
    .modal-card h2 { color: #9aadff; }
    .modal-card p  { color: #9098b8; }
    #sid-input { background: #12131f; border-color: #3a4580; color: #d0d8ff; }
    #sid-input:focus { border-color: #7080f0; }
}

</style>
</head>
<body>

<div id="student-modal">
  <div class="modal-card">
    <h2>Complement System Activity</h2>
    <p>Enter your <strong>5-digit PC lab code</strong> to begin.<br>Your code is provided by your instructor.</p>
    <input type="text" id="sid-input" maxlength="5" inputmode="numeric" placeholder="· · · · ·" autocomplete="off">
    <div id="sid-errtxt"></div>
    <button id="sid-btn">Begin Activity →</button>
  </div>
</div>

<div id="story">
  <div id="passage-container"></div>
</div>

<script>
const PASSAGES = {
"Start-Complement": `<h1>The Complement System</h1>
<p>The complement system is a crucial part of innate immunity. In this activity you will explore how each of the four pathways is activated, the steps that follow, and where the pathways converge.</p>

<div class="key-box">
<strong>Four pathways to explore:</strong><br>
1. The Classical Pathway<br>
2. The Alternative Pathway<br>
3. The Lectin Pathway<br>
4. Regulatory Control of Complement
</div>

<p>Each pathway contains questions — choose an answer to see immediate feedback and move forward. You can explore all four pathways in any order. Clinical case files are available at any time — use the link on the home page below.</p>

<div class="warning-box">
<strong>💡 How to get the most from this activity:</strong> When you see an answer you're unsure about, choose it deliberately — the feedback explains <em>why</em> it's wrong as well as what's correct. Exploring the wrong paths is part of the learning design.
</div>

<p><em>Where would you like to start?</em></p>

[[Explore the Classical Pathway|Classical-Intro]]
[[Explore the Alternative Pathway|Alternative-Intro]]
[[Explore the Lectin Pathway|Lectin-Intro]]

<hr style="border:none;margin:1rem 0;">

[[Explore Regulatory Control of Complement|Regulation_Intro]]
[[Review: Clinical Notes for CH50 Detectable Defects|Clinical-Notes-Menu]]`,

"Classical-Intro": `<div class="section-label classical">Classical Pathway</div>
<h1>1. The Classical Pathway</h1>
<p>The Classical Pathway is typically initiated by antigen-antibody complexes (IgM or IgG binding to surface antigens).</p>

<div class="key-box">
<strong>Sequence of Activation:</strong><br>
1. <strong>C1 Complex (C1q, C1r, C1s)</strong> binds to the Fc regions of bound antibodies.<br>
2. Active C1s cleaves <strong>C4</strong> into C4a and C4b.<br>
3. Active C1s also cleaves <strong>C2</strong> into C2a and C2b.<br>
4. <strong>C4b2a</strong> forms the Classical C3 Convertase, which cleaves C3 into C3a and C3b.
</div>

<p>Which immunoglobulin class is the most efficient initiator of the Classical Pathway?</p>

[[A) IgG4 (monomeric)|Classical-Q1-Incorrect]]
[[B) Pentameric IgM|Classical-Q1-Correct]]
[[C) IgE|Classical-Q1-Incorrect]]`,

"Classical-Q1-Correct": `<div class="section-label classical">Classical Pathway</div>
<h2>Correct!</h2>
<div class="feedback-correct">
<strong>Correct!</strong> Pentameric IgM has multiple binding sites in close proximity, allowing a single IgM molecule bound to an antigen surface to easily engage the C1 complex (specifically C1q).
</div>
<p>Monomeric IgG requires multiple IgG molecules closely spaced together to effectively dock C1q.</p>

<br>
[[Continue to C3 Convertase Question|Classical-Q2]]`,

"Classical-Q1-Incorrect": `<div class="section-label classical">Classical Pathway</div>
<h2>Incorrect</h2>
<div class="feedback-incorrect">
<strong>Incorrect.</strong> Monomeric immunoglobulins like IgG4 or IgE are inefficient at binding C1q compared to multimeric antibodies.
</div>
<p>Pentameric IgM is the most effective antibody isotype at initiating the classical cascade because its multiple Fc arms easily cross-link C1q.</p>

<br>
[[Try Question 1 Again|Classical-Intro]]`,

"Classical-Q2": `<div class="section-label classical">Classical Pathway</div>
<h2>Question 2: C3 Convertase</h2>
<p>What is the enzymatic complex responsible for cleaving C3 in the Classical Pathway?</p>

[[A) C3bBb|Classical-Q2-Incorrect]]
[[B) C4b2a|Classical-Q2-Correct]]
[[C) C5b67|Classical-Q2-Incorrect]]`,

"Classical-Q2-Correct": `<div class="section-label classical">Classical Pathway</div>
<h2>Correct!</h2>
<div class="feedback-correct">
<strong>Correct!</strong> <strong>C4b2a</strong> is the Classical (and Lectin) pathway C3 convertase.
</div>
<p>It cleaves fluid-phase C3 into the potent anaphylatoxin C3a and the opsonin C3b.</p>

<br>
[[← Return to Main Menu|Start-Complement]]`,

"Classical-Q2-Incorrect": `<div class="section-label classical">Classical Pathway</div>
<h2>Incorrect</h2>
<div class="feedback-incorrect">
<strong>Incorrect.</strong> C3bBb is the C3 convertase of the <em>Alternative</em> pathway.
</div>
<p>In the Classical pathway, C1s cleaves C4 and C2 to form <strong>C4b2a</strong>.</p>

<br>
[[Try Question 2 Again|Classical-Q2]]`,

"Alternative-Intro": `<div class="section-label alternative">Alternative Pathway</div>
<h1>2. The Alternative Pathway</h1>
<p>The Alternative Pathway provides continuous, low-level surveillance through spontaneous hydrolysis of C3 ("tickover"). It does not require antibodies for activation.</p>

<div class="key-box">
<strong>Key Components:</strong> C3(H2O), Factor B, Factor D, Properdin (Stabiliser).<br>
<strong>C3 Convertase:</strong> C3bBb
</div>

<p>Which factor stabilizes the short-lived Alternative C3 Convertase (C3bBb) on target cell surfaces?</p>

[[A) Factor H|Alternative-Q1-Incorrect]]
[[B) Factor D|Alternative-Q1-Incorrect]]
[[C) Properdin (Factor P)|Alternative-Q1-Correct]]`,

"Alternative-Q1-Correct": `<div class="section-label alternative">Alternative Pathway</div>
<h2>Correct!</h2>
<div class="feedback-correct">
<strong>Correct!</strong> <strong>Properdin (Factor P)</strong> binds to and stabilizes C3bBb, extending its half-life by up to 10-fold on pathogen surfaces.
</div>

<br>
[[← Return to Main Menu|Start-Complement]]`,

"Alternative-Q1-Incorrect": `<div class="section-label alternative">Alternative Pathway</div>
<h2>Incorrect</h2>
<div class="feedback-incorrect">
<strong>Incorrect.</strong> Factor H is a regulatory protein that <em>promotes decay</em> of C3bBb on host cells. Factor D cleaves Factor B.
</div>
<p><strong>Properdin</strong> is the positive regulator that stabilizes the convertase.</p>

<br>
[[Try Again|Alternative-Intro]]`,

"Lectin-Intro": `<div class="section-label lectin">Lectin Pathway</div>
<h1>3. The Lectin Pathway</h1>
<p>The Lectin Pathway is triggered when pattern recognition molecules like <strong>Mannose-Binding Lectin (MBL)</strong> or <strong>Ficolins</strong> recognize carbohydrate patterns on microbial surfaces.</p>

<div class="key-box">
<strong>Key Proteases:</strong> MASP-1 and MASP-2 (MBL-Associated Serine Proteases).<br>
<strong>C3 Convertase:</strong> C4b2a (identical to the Classical pathway).
</div>

<p>Which serine protease in the Lectin pathway is primarily responsible for cleaving C4 and C2 to generate the C3 convertase?</p>

[[A) MASP-2|Lectin-Q1-Correct]]
[[B) Factor D|Lectin-Q1-Incorrect]]
[[C) C1s|Lectin-Q1-Incorrect]]`,

"Lectin-Q1-Correct": `<div class="section-label lectin">Lectin Pathway</div>
<h2>Correct!</h2>
<div class="feedback-correct">
<strong>Correct!</strong> <strong>MASP-2</strong> is the functional analogue of C1s and is responsible for cleaving both C4 and C2 to form C4b2a.
</div>

<br>
[[← Return to Main Menu|Start-Complement]]`,

"Lectin-Q1-Incorrect": `<div class="section-label lectin">Lectin Pathway</div>
<h2>Incorrect</h2>
<div class="feedback-incorrect">
<strong>Incorrect.</strong> C1s belongs to the Classical pathway, and Factor D belongs to the Alternative pathway.
</div>
<p>In the Lectin pathway, <strong>MASP-2</strong> executes C4 and C2 cleavage.</p>

<br>
[[Try Again|Lectin-Intro]]`,

"Regulation_Intro": `<div class="section-label regulation">Regulatory Control</div>
<h1>4. Regulatory Control of Complement</h1>
<p>Because complement activation generates powerful inflammatory mediators and membrane attack complexes, host cells require multiple fluid-phase and membrane-bound regulators to prevent self-tissue destruction.</p>

<div class="key-box">
<strong>Key Regulators:</strong><br>
• <strong>C1 Inhibitor (C1-INH):</strong> Inactivates C1r, C1s, MASP-1, and MASP-2.<br>
• <strong>Factor H & Factor I:</strong> Inactivate C3b to iC3b.<br>
• <strong>DAF (CD55):</strong> Accelerates decay of C3 convertases.<br>
• <strong>CD59 (Protectin):</strong> Blocks MAC assembly by binding C8/C9.
</div>

<p><em>Select a question to test your knowledge:</em></p>

[[Question 1: C1-INH Targets|Regulation_Q2]]
[[Question 2: Terminal MAC Regulation|Regulation_Q3]]

<br>
[[← Return to Main Menu|Start-Complement]]`,

"Regulation_Q2": `<div class="section-label regulation">Regulatory Control</div>
<h2>Question 1: C1 Inhibitor Targets</h2>
<p>Which complement initiation pathway(s) are regulated by C1 inhibitor (C1-INH)?</p>

[[A) Alternative pathway initiation only|Regulation_Q2_Incorrect_Alt]]
[[B) Terminal Membrane Attack Complex (MAC) assembly|Regulation_Q2_Incorrect_MAC]]
[[C) Initial activation steps of the Classical and Lectin pathways|Regulation_Q2_Correct_ClassicalLectinInit]]`,

"Regulation_Q2_Correct_ClassicalLectinInit": `<div class="section-label regulation">Regulatory Control</div>
<h2>Correct!</h2>
<div class="feedback-correct">
<strong>Correct!</strong> C1 inhibitor (C1-INH) regulates the initial activation steps of both the <strong>Classical pathway</strong> (by inactivating C1r and C1s) and the <strong>Lectin pathway</strong> (by inactivating MASP-1 and MASP-2).
</div>
<p>By irreversibly binding to and inhibiting these active serine proteases, C1-INH halts the cascade before C4 and C2 cleavage can occur, preventing uncontrolled activation.</p>

<div class="key-box">
<strong>Clinical Relevance:</strong> Deficiency of functional C1-INH leads to <strong>Hereditary Angioedema (HAE)</strong> due to unchecked activation of C1 and the kallikrein-kinin system, producing elevated bradykinin levels.
</div>

<br>
[[Continue to Question 2: MAC Regulation|Regulation_Q3]]
<br>
[[← Return to Regulatory Control Menu|Regulation_Intro]]`,

"Regulation_Q2_Incorrect_Alt": `<div class="section-label regulation">Regulatory Control</div>
<h2>Incorrect</h2>
<div class="feedback-incorrect">
<strong>Incorrect.</strong> The alternative pathway initiation relies on Factor H and Factor I for regulatory control, not C1-INH.
</div>
<p>C1-INH acts on specific target proteases in the Classical (C1r/C1s) and Lectin (MASP-1/MASP-2) pathways.</p>

<br>
[[Try Question 1 Again|Regulation_Q2]]`,

"Regulation_Q2_Incorrect_MAC": `<div class="section-label regulation">Regulatory Control</div>
<h2>Incorrect</h2>
<div class="feedback-incorrect">
<strong>Incorrect.</strong> Terminal MAC assembly on host membrane cells is regulated by membrane-bound proteins like <strong>CD59 (Protectin)</strong>, not C1-INH.
</div>
<p>C1-INH acts early in the cascade on initial serine proteases.</p>

<br>
[[Try Question 1 Again|Regulation_Q2]]`,

"Regulation_Q3": `<div class="section-label regulation">Regulatory Control</div>
<h2>Question 2: Terminal MAC Regulation</h2>
<p>Which membrane protein prevents host cell lysis by binding to C8 and C9, blocking Membrane Attack Complex (MAC) polymerization?</p>

[[A) CD59 (Protectin)|Regulation_Q3_Correct]]

/* ── JavaScript Engine ────────────────────────────────────── */
const historyStack = [];

function parseWikiLinks(text) {
    return text.replace(/\[\[(.*?)(?:\|(.*?))?\]\]/g, (match, p1, p2) => {
        const displayText = p2 ? p1 : p1;
        const targetPassage = p2 ? p2 : p1;
        
        let linkClass = "link-internal";
        if (targetPassage.includes("Correct") || targetPassage.includes("Incorrect") || displayText.match(/^[A-D]\)/)) {
            linkClass += " link-answer";
        } else if (displayText.includes("Continue") || displayText.includes("Next")) {
            linkClass += " link-continue";
        }

        return `<a class="${linkClass}" data-target="${targetPassage.trim()}">${displayText.trim()}</a>`;
    });
}

function renderPassage(passageKey, addHistory = true) {
    const container = document.getElementById('passage-container');
    const content = PASSAGES[passageKey];

    if (!content) {
        container.innerHTML = `
            <div class="passage">
                <h2>Error</h2>
                <div class="feedback-incorrect">
                    Passage not found: <strong>${passageKey}</strong>
                </div>
                <a class="back-btn" onclick="renderPassage('Start-Complement')">← Return to Main Menu</a>
            </div>
        `;
        return;
    }

    if (addHistory) {
        if (historyStack.length === 0 || historyStack[historyStack.length - 1] !== passageKey) {
            historyStack.push(passageKey);
        }
    }

    const html = parseWikiLinks(content);
    container.innerHTML = `<div class="passage">${html}</div>`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.addEventListener('DOMContentLoaded', () => {
    const modal = document.getElementById('student-modal');
    const sidInput = document.getElementById('sid-input');
    const sidBtn = document.getElementById('sid-btn');
    const sidErr = document.getElementById('sid-errtxt');

    function startApp() {
        const val = sidInput.value.trim();
        if (/^\d{5}$/.test(val)) {
            modal.style.display = 'none';
            renderPassage('Start-Complement');
        } else {
            sidInput.classList.add('sid-error');
            sidErr.textContent = 'Please enter a valid 5-digit lab code.';
            setTimeout(() => sidInput.classList.remove('sid-error'), 400);
        }
    }

    sidBtn.addEventListener('click', startApp);
    sidInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') startApp();
    });

    document.getElementById('passage-container').addEventListener('click', (e) => {
        const link = e.target.closest('[data-target]');
        if (link) {
            e.preventDefault();
            const target = link.getAttribute('data-target');
            if (target) {
                renderPassage(target);
            }
        }
    });
});
</script>
