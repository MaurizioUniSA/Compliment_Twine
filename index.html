<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Complement System — Interactive Pathway Learning Activity</title>
<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: #f4f5f9;
    color: #1a1a2e;
    font-size: clamp(15px, 2vw, 17px);
    line-height: 1.75;
    min-height: 100vh;
}

#story {
    max-width: 760px;
    margin: 0 auto;
    padding: 1.5rem 1rem 4rem;
}

.passage {
    background: #ffffff;
    border-radius: 14px;
    padding: 2rem 2.25rem;
    box-shadow: 0 2px 16px rgba(30,40,100,0.08);
    border: 1px solid #e4e8f0;
    animation: fadeSlide 0.3s ease;
}
@keyframes fadeSlide {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
}

h1 {
    font-size: 1.65rem;
    font-weight: 700;
    color: #1a1a2e;
    margin-bottom: 1rem;
    line-height: 1.25;
}
h2 {
    font-size: 1.2rem;
    font-weight: 600;
    color: #1e2d7a;
    margin-bottom: 0.85rem;
    padding-bottom: 0.4rem;
    border-bottom: 2px solid #eaecf8;
}
h3 {
    font-size: 1.05rem;
    font-weight: 600;
    color: #2d3a8c;
    margin-bottom: 0.6rem;
}

p {
    margin-bottom: 0.9rem;
}
p:last-child { margin-bottom: 0; }

a.link-internal {
    display: block;
    background: #f0f3ff;
    border: 1.5px solid #c8d1fa;
    border-radius: 9px;
    padding: 0.65rem 1.1rem;
    margin: 0.45rem 0;
    color: #1e2d7a;
    font-weight: 500;
    text-decoration: none;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    cursor: pointer;
}
a.link-internal:hover {
    background: #dce3ff;
    border-color: #7c8fee;
    transform: translateX(3px);
    text-decoration: none;
    color: #111e6e;
}
a.link-internal:active {
    background: #c7d0f9;
    transform: translateX(1px);
}

.feedback-correct {
    background: #f0fbf4;
    border-left: 4px solid #27a85f;
    border-radius: 0 9px 9px 0;
    padding: 0.8rem 1rem;
    margin: 0.5rem 0 1rem;
    color: #14472e;
}
.feedback-incorrect {
    background: #fff4f0;
    border-left: 4px solid #e05a2b;
    border-radius: 0 9px 9px 0;
    padding: 0.8rem 1rem;
    margin: 0.5rem 0 1rem;
    color: #5c2010;
}

.key-box {
    background: #fafbff;
    border: 1px solid #d4daf7;
    border-radius: 9px;
    padding: 0.8rem 1rem;
    margin: 0.8rem 0;
    font-size: 0.95rem;
    line-height: 1.65;
}
.key-box strong { color: #1e2d7a; }

.progress-label {
    font-size: 0.78rem;
    color: #777;
    margin-bottom: 0.3rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}
.progress-bar {
    background: #e8eaf0;
    border-radius: 99px;
    height: 5px;
    margin-bottom: 1.25rem;
    overflow: hidden;
}
.progress-fill {
    background: linear-gradient(90deg, #4a6cf7, #7c8fee);
    height: 100%;
    border-radius: 99px;
}

.section-label {
    display: inline-block;
    border-radius: 99px;
    padding: 0.18rem 0.75rem;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 0.75rem;
    background: #e8eaf0;
    color: #444;
}
.section-label.classical   { background: #e6f0ff; color: #0a4d8f; }
.section-label.alternative { background: #e6fff0; color: #0a5c35; }
.section-label.lectin      { background: #fff8e6; color: #7a4800; }
.section-label.shared      { background: #f5e6ff; color: #5b0a8a; }
.section-label.regulation  { background: #fff3e0; color: #7a3800; }
.section-label.clinical    { background: #e6f7ff; color: #006699; }

.clinical-table {
    width: 100%;
    border-collapse: collapse;
    margin: 1rem 0;
    font-size: 0.92rem;
}
.clinical-table th, .clinical-table td {
    border: 1px solid #d4daf7;
    padding: 0.6rem 0.8rem;
    text-align: left;
}
.clinical-table th {
    background: #fafbff;
    color: #1e2d7a;
    font-weight: 600;
}

.back-btn {
    display: inline-block;
    margin-top: 1.25rem;
    padding: 0.5rem 1rem;
    background: #f0f3ff;
    border: 1.5px solid #c8d1fa;
    border-radius: 9px;
    color: #1e2d7a;
    font-weight: 500;
    font-size: 0.92rem;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s, border-color 0.15s;
}
.back-btn:hover {
    background: #dce3ff;
    border-color: #7c8fee;
}

.mcq-link {
    display: block;
    margin-top: 0.5rem;
    padding: 0.65rem 1rem;
    background: #f0faf4;
    border: 1.5px solid #27a85f;
    border-radius: 9px;
    color: #0d4a2e;
    font-weight: 600;
    font-size: 0.97rem;
    text-decoration: none;
    transition: background 0.15s, border-color 0.15s;
}
.mcq-link:hover {
    background: #d4f0e2;
    border-color: #1a7a45;
}

/* ── Student ID Modal ─────────────────────────────────── */
#student-modal {
    position: fixed;
    inset: 0;
    background: rgba(20,30,80,0.82);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    backdrop-filter: blur(6px);
}
.modal-card {
    background: #fff;
    border-radius: 18px;
    padding: 2.6rem 2.2rem 2.2rem;
    max-width: 390px;
    width: 92%;
    text-align: center;
    box-shadow: 0 28px 80px rgba(0,0,0,0.32);
}
.modal-card h2 { margin:0 0 0.5rem; color:#1e2d7a; font-size:1.45rem; }
.modal-card p  { color:#556; font-size:0.95rem; margin:0 0 1.5rem; line-height:1.55; }
#sid-input {
    width:100%; box-sizing:border-box;
    font-size:2.4rem; text-align:center;
    letter-spacing:0.6em; padding:0.5rem 0.3rem;
    border:2.5px solid #c8d1fa; border-radius:10px;
    color:#1e2d7a; outline:none; margin-bottom:0.45rem;
    transition:border-color 0.15s; font-family:monospace;
}
#sid-input:focus { border-color:#5b6ef5; }
#sid-input.sid-error { border-color:#e74c3c; animation:shake 0.3s; }
@keyframes shake {
  0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)}
}
#sid-errtxt { color:#c0392b; font-size:0.85rem; min-height:1.3em; margin-bottom:0.75rem; }
#sid-btn {
    width:100%; padding:0.82rem;
    background:#3d52d5; color:white;
    border:none; border-radius:10px;
    font-size:1.05rem; font-weight:600;
    cursor:pointer; transition:background 0.15s; margin-top:0.3rem;
}
#sid-btn:hover { background:#2a3db8; }

/* ── Mobile table scroll ─────────────────────────────────── */
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: .8rem 0; }

/* ── Answer vs navigation link styles ────────────────── */
a.link-answer {
    background: #fafbff;
    border: 1.5px solid #c0c8f4;
    color: #2a3460;
    font-weight: 400;
    font-size: 0.96rem;
}
a.link-answer::before { content: "○ "; color: #9aa5e0; }
a.link-answer:hover {
    background: #edf0fc;
    border-color: #7c8fee;
    color: #1a2350;
}
a.link-continue {
    background: #1e2d7a;
    border: 1.5px solid #162060;
    color: #fff;
    font-weight: 600;
}
a.link-continue:hover {
    background: #2a3e9e;
    border-color: #1e2d7a;
    color: #fff;
    transform: translateX(3px);
}
a.link-continue:active { background: #152050; }

/* ── Accessible Notification Boxes ────────── */
.notice-box {
    background: #eef3ff;
    border: 1px solid #b6c6f5;
    border-radius: 9px;
    padding: .75rem 1rem;
    margin: .85rem 0;
    font-size: .94rem;
    color: #182663;
}
.notice-box strong { color: #0d1a4e; }

.warning-box {
    background: #fbf4e6;
    border: 1px solid #e6cb85;
    border-radius: 9px;
    padding: .75rem 1rem;
    margin: .85rem 0;
    font-size: .94rem;
    color: #3b2802;
}
.warning-box strong { color: #241801; }

.menu-exit-container {
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 1px dashed #cbd2e1;
    text-align: center;
}

/* ── Dark mode ──────────────────────────────────────────── */
@media (prefers-color-scheme: dark) {
    body         { background: #12131f; color: #d8daf0; }
    .passage     { background: #1e1f35; border-color: #2e3058; box-shadow: 0 2px 16px rgba(0,0,0,0.4); }
    h1           { color: #e0e3ff; }
    h2           { color: #9aadff; border-color: #2e3060; }
    h3           { color: #8a9dee; }
    .key-box     { background: #1a1b2e; border-color: #2e3060; }
    .key-box strong { color: #9aadff; }
    
    .notice-box  { background: #1a2245; border-color: #3a4b90; color: #d0dcff; }
    .notice-box strong { color: #ffffff; }
    .warning-box { background: #332810; border-color: #705820; color: #fde8b8; }
    .warning-box strong { color: #fff; }
    .menu-exit-container { border-top-color: #2e3060; }

    a.link-internal {
        background: #1e2045; border-color: #3a4580; color: #b0c0ff;
    }
    a.link-internal:hover { background: #2a2e5a; border-color: #6070d0; color: #c8d4ff; }
    a.link-answer { background: #181928; border-color: #2e3458; color: #9aa8d8; }
    a.link-answer:hover { background: #202245; }
    a.link-continue { background: #2e42b0; border-color: #3a52c8; }
    a.link-continue:hover { background: #3a52c8; }
    .back-btn    { background: #1e2045; border-color: #3a4580; color: #b0c0ff; }
    .back-btn:hover { background: #2a2e5a; }
    .feedback-correct { background: #0e2018; border-color: #27a85f; color: #6ee8a0; }
    .feedback-incorrect { background: #200e08; border-color: #e05a2b; color: #f0a080; }
    .section-label.classical   { background: #0a1a3a; color: #6090e0; }
    .section-label.alternative { background: #0a1e14; color: #60c890; }
    .section-label.lectin      { background: #1e1600; color: #e0a860; }
    .section-label.shared      { background: #1e0a30; color: #c070f0; }
    .section-label.regulation  { background: #1e1000; color: #d08040; }
    .section-label.clinical    { background: #001830; color: #50b0e0; }
    .progress-bar { background: #2a2c40; }
    .clinical-table th         { background: #1a1c30; color: #9aadff; }
    .clinical-table th, .clinical-table td { border-color: #2e3060; }
    .modal-card { background: #1e1f35; color: #d8daf0; }
    .modal-card h2 { color: #9aadff; }
    .modal-card p  { color: #9098b8; }
    #sid-input { background: #12131f; border-color: #3a4580; color: #d0d8ff; }
    #sid-input:focus { border-color: #7080f0; }
}

</style>
</head>
<body>
<div id="student-modal">
  <div class="modal-card">
    <h2>Complement System Activity</h2>
    <p>Enter your <strong>5-digit PC lab code</strong> to begin.<br>Your code is provided by your instructor.</p>
    <input type="text" id="sid-input" maxlength="5" inputmode="numeric" placeholder="· · · · ·" autocomplete="off">
    <div id="sid-errtxt"></div>
    <button id="sid-btn">Begin Activity →</button>
  </div>
</div>
<div id="story">
  <div id="passage-container"></div>
</div>
<script>
const PASSAGES = {
"Start-Complement": "<h1>The Complement System</h1>\n<p>The complement system is a crucial part of innate immunity. In this activity you will explore how each of the four pathways is activated, the steps that follow, and where the pathways converge.</p>\n\n<div class=\"key-box\">\n<strong>Four pathways to explore:</strong><br>\n1. The Classical Pathway<br>\n2. The Alternative Pathway<br>\n3. The Lectin Pathway<br>\n4. Regulatory Control of Complement\n</div>\n\n<p>Each pathway contains questions — choose an answer to see immediate feedback and move forward. You can explore all four pathways in any order. Clinical case files are available at any time — use the link on the home page below. You can explore the pathways and clinical cases in any order.</p>\n\n<div class=\"warning-box\">\n<strong>💡 How to get the most from this activity:</strong> When you see an answer you're unsure about, choose it deliberately — the feedback explains <em>why</em> it's wrong as well as what's correct. Exploring the wrong paths is part of the learning design, not a mistake.\n</div>\n\n<p>''Where would you like to start?''</p>\n\n[[Explore the Classical Pathway|Classical-Intro]]\n[[Explore the Alternative Pathway|Alternative-Intro]]\n[[Explore the Lectin Pathway|Lectin-Intro]]\n\n<hr style=\"border:none;margin:1rem 0;\">\n\n[[Explore Regulatory Control of Complement|Regulation_Intro]]\n[[Review: Clinical Notes for CH50 Detectable Defects|Clinical-Notes-Menu]]\n\n<hr style=\"border:none;margin:1rem 0;\">\n<a class=\"link-internal mcq-link\" href=\"#\" data-target=\"Retrieval-Intro\">📝  MCQ Self-Test — Score Your Knowledge (10 questions)</a>", 

"Classical-Intro": "<div class=\"section-label classical\">Classical Pathway</div>\n<h1>1. The Classical Pathway</h1>\n<p>The Classical Pathway is typically initiated by antigen-antibody complexes (IgM or IgG binding to surface antigens).</p>\n\n<div class=\"key-box\">\n<strong>Sequence of Activation:</strong><br>\n1. <strong>C1 Complex (C1q, C1r, C1s)</strong> binds to Fc regions of bound antibodies.<br>\n2. Active C1s cleaves <strong>C4</strong> into C4a and C4b.<br>\n3. Active C1s cleaves <strong>C2</strong> into C2a and C2b.<br>\n4. <strong>C4b2a</strong> forms the Classical C3 Convertase.\n</div>\n\n<p>Which immunoglobulin class is the most efficient initiator of the Classical Pathway?</p>\n\n[[A) Monomeric IgG1|Classical-Q1-Incorrect]]\n[[B) Pentameric IgM|Classical-Q1-Correct]]\n[[C) IgE|Classical-Q1-Incorrect]]",

"Classical-Q1-Correct": "<div class=\"section-label classical\">Classical Pathway</div>\n<h2>Correct!</h2>\n<div class=\"feedback-correct\">\n<strong>Correct!</strong> Pentameric IgM has multiple Fc regions in close proximity, allowing a single IgM bound to an antigen to bind C1q efficiently.\n</div>\n<br>\n[[← Return to Main Menu|Start-Complement]]",

"Classical-Q1-Incorrect": "<div class=\"section-label classical\">Classical Pathway</div>\n<h2>Incorrect</h2>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> Monomeric antibodies require multiple molecules clustered together to engage C1q effectively.\n</div>\n<br>\n[[Try Question Again|Classical-Intro]]",

"Alternative-Intro": "<div class=\"section-label alternative\">Alternative Pathway</div>\n<h1>2. The Alternative Pathway</h1>\n<p>The Alternative Pathway provides continuous surveillance through spontaneous C3 hydrolysis ('tickover').</p>\n\n<div class=\"key-box\">\n<strong>C3 Convertase:</strong> C3bBb (stabilized by Properdin)\n</div>\n<p>Which factor stabilizes C3bBb on microbial surfaces?</p>\n\n[[A) Properdin (Factor P)|Alternative-Q1-Correct]]\n[[B) Factor H|Alternative-Q1-Incorrect]]\n[[C) Factor I|Alternative-Q1-Incorrect]]",

"Alternative-Q1-Correct": "<div class=\"section-label alternative\">Alternative Pathway</div>\n<h2>Correct!</h2>\n<div class=\"feedback-correct\">\n<strong>Correct!</strong> Properdin (Factor P) stabilizes the C3bBb convertase complex, extending its half-life.\n</div>\n<br>\n[[← Return to Main Menu|Start-Complement]]",

"Alternative-Q1-Incorrect": "<div class=\"section-label alternative\">Alternative Pathway</div>\n<h2>Incorrect</h2>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> Factors H and I are negative regulators that promote decay and cleavage of C3b.\n</div>\n<br>\n[[Try Question Again|Alternative-Intro]]",

"Lectin-Intro": "<div class=\"section-label lectin\">Lectin Pathway</div>\n<h1>3. The Lectin Pathway</h1>\n<p>The Lectin Pathway is activated when pattern recognition receptors (e.g., MBL or Ficolins) bind terminal sugars on microbial surfaces.</p>\n\n<div class=\"key-box\">\n<strong>Key Protease:</strong> MASP-2 cleaves C4 and C2 to form C4b2a.\n</div>\n<p>Which protease executes C4 and C2 cleavage in the Lectin pathway?</p>\n\n[[A) MASP-2|Lectin-Q1-Correct]]\n[[B) Factor D|Lectin-Q1-Incorrect]]\n[[C) C1s|Lectin-Q1-Incorrect]]",

"Lectin-Q1-Correct": "<div class=\"section-label lectin\">Lectin Pathway</div>\n<h2>Correct!</h2>\n<div class=\"feedback-correct\">\n<strong>Correct!</strong> MASP-2 is the functional analogue of C1s in the Lectin pathway.\n</div>\n<br>\n[[← Return to Main Menu|Start-Complement]]",

"Lectin-Q1-Incorrect": "<div class=\"section-label lectin\">Lectin Pathway</div>\n<h2>Incorrect</h2>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> C1s functions in the Classical pathway, and Factor D functions in the Alternative pathway.\n</div>\n<br>\n[[Try Question Again|Lectin-Intro]]",

"Regulation_Intro": "<div class=\"section-label regulation\">Regulatory Control</div>\n<h1>4. Regulatory Control of Complement</h1>\n<p>To prevent self-tissue destruction, human cells deploy fluid-phase and membrane-bound regulators to control complement activation.</p>\n\n<div class=\"key-box\">\n<strong>Key Regulators:</strong><br>\n• <strong>C1 Inhibitor (C1-INH):</strong> Inhibits C1r, C1s, MASP-1, MASP-2.<br>\n• <strong>Factor H & Factor I:</strong> Downregulate Alternative pathway convertases.<br>\n• <strong>CD59 (Protectin):</strong> Blocks MAC assembly.\n</div>\n\n<p>Which complement pathway step is inhibited by C1 Inhibitor (C1-INH)?</p>\n\n[[A) Formation of the Alternative C3 convertase|Regulation_Q2_Incorrect_Alt]]\n[[B) Polymerization of C9 in the Membrane Attack Complex|Regulation_Q2_Incorrect_MAC]]\n[[C) Initial activation steps of the Classical and Lectin pathways|Regulation_Q2_Correct_ClassicalLectinInit]]",

"Regulation_Q2_Correct_ClassicalLectinInit": "<div class=\"section-label regulation\">Regulatory Control</div>\n<h2>Correct!</h2>\n<div class=\"feedback-correct\">\n<strong>Correct!</strong> C1 inhibitor (C1-INH) regulates the initial activation steps of both the <strong>Classical pathway</strong> (by inactivating C1r and C1s) and the <strong>Lectin pathway</strong> (by inactivating MASP-1 and MASP-2).\n</div>\n<p>By irreversibly binding to and inactivating these active serine proteases, C1-INH halts the cascade before C4 and C2 cleavage can occur, preventing uncontrolled downstream activation.</p>\n\n<div class=\"key-box\">\n<strong>Clinical Note:</strong> Deficiency of C1-INH causes <strong>Hereditary Angioedema (HAE)</strong> due to excessive bradykinin generation and uninhibited complement activation.\n</div>\n\n<br>\n[[← Return to Regulatory Control Menu|Regulation_Intro]]\n<br>\n[[← Return to Main Menu|Start-Complement]]",

"Regulation_Q2_Incorrect_Alt": "<div class=\"section-label regulation\">Regulatory Control</div>\n<h2>Incorrect</h2>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> Alternative pathway convertases are regulated by Factor H, Factor I, and DAF (CD55), not C1-INH.\n</div>\n<br>\n[[Try Question Again|Regulation_Intro]]",

"Regulation_Q2_Incorrect_MAC": "<div class=\"section-label regulation\">Regulatory Control</div>\n<h2>Incorrect</h2>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> Polymerization of C9 in the Membrane Attack Complex is blocked on host cell membranes by CD59 (Protectin).\n</div>\n<br>\n[[Try Question Again|Regulation_Intro]]",

"Clinical-Notes-Menu": "<div class=\"section-label clinical\">Clinical Medicine</div>\n<h1>Classical Complement Pathway Deficiencies</h1>\n<p>The <strong>CH50 (total haemolytic complement) assay</strong> tests the ability of serum to lyse 50% of antibody-sensitised sheep erythrocytes via the classical pathway (C1-C9). A deficiency in any single component renders the assay severely reduced or absent. Evaluating these case studies illustrates distinct pathway deficiencies with characteristic clinical and laboratory profiles.</p>\n<div class=\"notice-box\">\n<strong>⚠️ Reminder — Immune Complex Clearance:</strong> One critical function of complement is clearing immune complexes. C3b and C4b coat complexes; CR1 on red blood cells then shuttles them to the liver and spleen for macrophage-mediated destruction. Defects in this pathway (C1q, C2, C4) allow immune complexes to deposit in tissues — driving the SLE-like phenotype seen in Cases 1, 2 and 4.\n</div>\n\n<p>''Select a clinical case file to review:''</p>\n\n[[Case 1: C1q Deficiency (9yo F — Recurrent Infections & Lupus-like Rash)|Clinical-Case-1]]\n[[Case 2: C2 Deficiency (34yo M — Recurrent Sinopulmonary Infections & SLE)|Clinical-Case-2]]\n[[Case 3: C3 Deficiency (3yo M — Severe Phenotype / Multi-Pathway Failure)|Clinical-Case-3]]\n[[Case 4: C4A/C4B Null Allele Deficiency (22yo F — Treatment-Refractory SLE)|Clinical-Case-4]]\n[[Case 5: C5 Deficiency (19yo M — Recurrent Neisseria Meningitidis)|Clinical-Case-5]]\n[[📊 Review CH50 vs AP50 Diagnostic Summary Table|Clinical-Diagnostic-Summary]]\n\n<br>\n[[← Return to Main Pathway Selection|Start-Complement]]",

"Clinical-Case-1": "<div class=\"section-label clinical\">Clinical Case Study</div>\n<h2>Case 1: C1q Deficiency [Rare autosomal recessive]</h2>\n<p><strong>Patient Profile:</strong> Female, 9 years old — recurrent infections & lupus-like rash.</p>\n\n<h3>Pathway Blockade Site</h3>\n<p><strong>C1q [BLOCKED]</strong> → C1r/C1s → C4 → C2 → C3 → MAC (C5–C9)</p>\n\n<h3>Clinical Presentation</h3>\n<p>A 9-year-old girl is referred to paediatric immunology with a 3-year history of a photosensitive malar rash, recurrent otitis media, and two prior episodes of pneumococcal bacteraemia. She has mild arthralgia affecting the small joints of her hands. Her mother reports that a maternal uncle died in childhood from 'overwhelming infection.' On examination she has a butterfly-shaped erythematous rash over both cheeks sparing the nasolabial folds, and mild cervical lymphadenopathy.</p>\n\n<h3>Laboratory Findings</h3>\n<div class=\"table-scroll\">\n<table class=\"clinical-table\">\n  <tr><th>Test</th><th>Result</th><th>Reference / Note</th></tr>\n  <tr><td>CH50 (total haemolytic)</td><td><strong>0 U/mL</strong></td><td>Ref: 41–90 U/mL — absent activity</td></tr>\n  <tr><td>C1q antigen level</td><td><strong>&lt;1 mg/dL</strong></td><td>Ref: 14–22 mg/dL — undetectable</td></tr>\n  <tr><td>C4 level</td><td><strong>Low-normal</strong></td><td>Upstream blockade limits consumption</td></tr>\n  <tr><td>ANA / anti-dsDNA</td><td><strong>Positive (1:320)</strong></td><td>Mimics SLE serology</td></tr>\n  <tr><td>AP50 (alternative pathway)</td><td><strong>Normal</strong></td><td>Alternative pathway intact</td></tr>\n  <tr><td>C1q functional assay</td><td><strong>Absent</strong></td><td>Confirms absence of C1q function</td></tr>\n</table>\n</div>\n\n<h3>Pathophysiology</h3>\n<p>C1q is the pattern-recognition subunit of the C1 complex. Its absence abolishes classical pathway activation from the very first step, explaining the zero CH50 despite intact C4 and C3 protein levels. C1q also acts as a bridge molecule for clearing apoptotic cell debris. C1q directly binds exposed <strong>phosphatidylserine</strong>, <strong>DNA</strong>, and <strong>calreticulin</strong> on the surface of apoptotic cells, flagging them for macrophage uptake. Without this function, apoptotic cells accumulate and release nuclear autoantigens (especially dsDNA and histones) — triggering anti-dsDNA antibodies and ANA production. This mechanism produces an SLE-like phenotype in up to 93% of C1q-deficient patients. The inability to opsonise encapsulated bacteria via complement explains the recurrent pneumococcal and Haemophilus infections.</p>\n\n<h3>Management</h3>\n<p>Lifelong prophylactic penicillin V; catch-up immunisation with PCV13, MenACWY, MenB, and Hib vaccines. Hydroxychloroquine for the autoimmune phenotype. Low-threshold antibiotic therapy for febrile illness. Genetic counselling (autosomal recessive — COLEC11/C1QA/B/C loci) and screening of siblings.</p>\n\n[[Return to Clinical Notes Menu|Clinical-Notes-Menu]]",

"Clinical-Case-2": "<div class=\"section-label clinical\">Clinical Case Study</div>\n<h2>Case 2: C2 Deficiency [Most common classical deficiency]</h2>\n<p><strong>Patient Profile:</strong> Male, 34 years old — recurrent sinopulmonary infections & SLE diagnosis.</p>\n\n<h3>Pathway Blockade Site</h3>\n<p>C1q → C1r/C1s → C4 → <strong>C2 [BLOCKED]</strong> → C3 convertase (C4b2a) → MAC</p>\n\n<h3>Clinical Presentation</h3>\n<p>A 34-year-old male solicitor presents with his fourth episode of bacterial sinusitis in 18 months, twice requiring intravenous antibiotics. He was diagnosed with SLE at age 28, with arthritis, a discoid rash, and pleuritis. He recalls his father having 'immune problems.' His SLE has been atypically resistant to standard therapy. He has no history of Neisseria infections. On examination there is bilateral tenderness over the maxillary sinuses and a small pleural rub at the left base.</p>\n\n<h3>Laboratory Findings</h3>\n<div class=\"table-scroll\">\n<table class=\"clinical-table\">\n  <tr><th>Test</th><th>Result</th><th>Reference / Note</th></tr>\n  <tr><td>CH50</td><td><strong>&lt;10 U/mL</strong></td><td>Severely reduced — near absent</td></tr>\n  <tr><td>C2 antigen</td><td><strong>Undetectable</strong></td><td>Ref: 22–34 mg/dL</td></tr>\n  <tr><td>C4 level</td><td><strong>Normal</strong></td><td>C4 cleavage cannot proceed without C2</td></tr>\n  <tr><td>C3 level</td><td><strong>Normal</strong></td><td>Alternative pathway maintains some C3</td></tr>\n  <tr><td>AP50</td><td><strong>Normal</strong></td><td>C2 not used in alternative pathway</td></tr>\n  <tr><td>MBL pathway function</td><td><strong>Reduced</strong></td><td>MBL pathway also uses C2; impaired</td></tr>\n</table>\n</div>\n\n<h3>Pathophysiology</h3>\n<p>C2 is cleaved by C1s to form C2a and C2b. C4b2a (the classical C3 convertase) cannot form without C2a, arresting the cascade before C3 cleavage and abolishing opsonisation via this route. C2 deficiency is the most common inherited complement deficiency in people of Northern European ancestry (approximately 1 in 10,000–20,000), typically linked to the HLA-A25, B18, DR2 haplotype. Because C2 is also used by the lectin/MBL pathway, both CH50 and MBL-dependent haemolysis are impaired, but AP50 is completely normal — a diagnostically useful dissociation. Impaired immune complex clearance predisposes to SLE-like disease in approximately 10–30% of homozygous-deficient individuals.</p>\n\n<h3>Management</h3>\n<p>Prophylactic amoxicillin-clavulanate or azithromycin; pneumococcal, meningococcal, and Hib vaccination with periodic booster doses. SLE managed with hydroxychloroquine and low-dose prednisolone; note that belimumab (anti-BAFF) may be preferred over complement-pathway biologics. Genetic testing (chromosome 6p21.3, MHC class III region) and family cascade testing.</p>\n\n[[Return to Clinical Notes Menu|Clinical-Notes-Menu]]",

"Clinical-Case-3": "<div class=\"section-label clinical\">Clinical Case Study</div>\n<h2>Case 3: C3 Deficiency [Severe phenotype — all pathways affected]</h2>\n<p><strong>Patient Profile:</strong> Male, 3 years old — recurrent severe bacterial infections since infancy.</p>\n\n<h3>Pathway Blockade Site</h3>\n<p>C1–C4–C2 → <strong>C3 [BLOCKED]</strong> → C3b opsonisation → C5 convertase → MAC (C5–C9)</p>\n\n<h3>Clinical Presentation</h3>\n<p>A 3-year-old boy is admitted for the fifth time with pneumococcal meningitis. Since age 6 months he has had recurrent episodes of pneumonia, otitis media, and two prior episodes of septicaemia with Streptococcus pneumoniae. Growth is on the 3rd centile. He is the first child of consanguineous parents (first cousins) of South Asian origin. His parents report that a sibling died at 18 months from an unspecified overwhelming infection. On admission he is febrile (39.2°C), tachycardic, has neck stiffness, and a bulging fontanelle.</p>\n\n<h3>Laboratory Findings</h3>\n<div class=\"table-scroll\">\n<table class=\"clinical-table\">\n  <tr><th>Test</th><th>Result</th><th>Reference / Note</th></tr>\n  <tr><td>CH50</td><td><strong>0 U/mL</strong></td><td>Completely absent</td></tr>\n  <tr><td>AP50</td><td><strong>0 U/mL</strong></td><td>Also absent — C3 required by all pathways</td></tr>\n  <tr><td>C3 antigen level</td><td><strong>&lt;1 mg/dL</strong></td><td>Ref: 90–180 mg/dL — undetectable</td></tr>\n  <tr><td>C4 level</td><td><strong>Normal</strong></td><td>Upstream intact; cannot signal downstream</td></tr>\n  <tr><td>C1q level</td><td><strong>Normal</strong></td><td>Recognition unit unaffected</td></tr>\n  <tr><td>Opsonophagocytosis assay</td><td><strong>Severely impaired</strong></td><td>No C3b deposition on bacteria</td></tr>\n</table>\n</div>\n\n<h3>Pathophysiology</h3>\n<p>C3 is the convergence point of all three complement pathways. Its absence renders the patient unable to generate C3b for opsonisation (via CR1 on phagocytes), C3a for mast cell degranulation, or C5 convertase — eliminating both innate killing and antibody-independent opsonisation simultaneously. This explains why both CH50 and AP50 are zero — a key diagnostic fingerprint distinguishing C3 deficiency from classical-only or alternative-only defects. Secondary C3 deficiency (from consumption — e.g. C3 nephritic factor, MPGN) must be excluded; primary deficiency is autosomal recessive and rare, with consanguinity being a major risk factor. Encapsulated bacteria (pneumococcus, meningococcus, Haemophilus) that rely on complement-mediated opsonisation for clearance cause disproportionate, recurrent, life-threatening disease.</p>\n\n<h3>Management</h3>\n<p>Emergency treatment of active meningitis per local protocol (ceftriaxone + dexamethasone). Long-term: lifelong prophylactic phenoxymethylpenicillin; full immunisation schedule including 13-valent PCV, ACWY and B meningococcal vaccines, Hib, and annual influenza. Regular IVIG infusions considered to supplement opsonising antibody. Genetic counselling and urgent sibling screening (C3 gene on chromosome 19p13.3). Parental education regarding fever response and emergency antibiotic supply.</p>\n\n[[Return to Clinical Notes Menu|Clinical-Notes-Menu]]",

"Clinical-Case-4": "<div class=\"section-label clinical\">Clinical Case Study</div>\n<h2>Case 4: C4A/C4B Null Allele Deficiency [SLE susceptibility locus]</h2>\n<p><strong>Patient Profile:</strong> Female, 22 years old — early-onset SLE refractory to treatment.</p>\n\n<h3>Pathway Blockade Site</h3>\n<p>C1q → C1r/C1s → <strong>C4 [PARTIAL BLOCK]</strong> → C4b2a convertase → C3 → MAC</p>\n\n<h3>Clinical Presentation</h3>\n<p>A 22-year-old woman of West African origin is referred to rheumatology after 18 months of fatigue, a photosensitive facial rash, painful oral ulcers, pleuritis, and diffuse non-scarring alopecia. She has had two prior episodes of non-bacterial (sterile) peritonitis. Blood tests showed lymphopenia and a raised ESR, initially attributed to viral illness. Family history is notable for a maternal aunt with SLE. On examination she has a malar rash, two oral ulcers, and mild bilateral pitting oedema. Urinalysis shows 3+ protein and microscopic haematuria, raising concern for lupus nephritis.</p>\n\n<h3>Laboratory Findings</h3>\n<div class=\"table-scroll\">\n<table class=\"clinical-table\">\n  <tr><th>Test</th><th>Result</th><th>Reference / Note</th></tr>\n  <tr><td>CH50</td><td><strong>18 U/mL</strong></td><td>Ref: 41–90 — substantially reduced</td></tr>\n  <tr><td>C4 total antigen</td><td><strong>4 mg/dL</strong></td><td>Ref: 16–38 mg/dL — severely low</td></tr>\n  <tr><td>C4A isotype</td><td><strong>Undetectable</strong></td><td>Homozygous C4A null allele confirmed</td></tr>\n  <tr><td>C4B isotype</td><td><strong>Low (1 copy)</strong></td><td>One functional C4B allele retained</td></tr>\n  <tr><td>C3 level</td><td><strong>Low (58 mg/dL)</strong></td><td>Ref: 90–180 — consumed by active disease</td></tr>\n  <tr><td>Anti-C1q antibodies</td><td><strong>Positive</strong></td><td>Associated with active nephritis in SLE</td></tr>\n</table>\n</div>\n\n<h3>Pathophysiology</h3>\n<p>C4 serves two key functions in the classical and lectin pathways: forming the C3 convertase (C4b2a), and coating immune complexes via C4b to prevent their tissue deposition. In this patient, reduced total C4 impairs both functions — immune complexes are inadequately opsonised and cannot be transported efficiently by CR1 on erythrocytes to the liver and spleen for clearance. Accumulating immune complexes deposit in the glomerulus and other tissues, driving the SLE phenotype — the same mechanism responsible for SLE-like disease in C1q and C2 deficiency. Residual C4 activity means the classical pathway retains some function — explaining the reduced but not zero CH50. During active disease, remaining C4 is consumed further, causing CH50 depression and low C3. The AP50 remains normal since C4 is not required for the alternative pathway.</p>\n\n<h3>Management</h3>\n<p>Renal biopsy to classify lupus nephritis (likely class III/IV given urinalysis findings). Treatment per EULAR/ACR guidance: hydroxychloroquine as backbone; mycophenolate mofetil or low-dose cyclophosphamide for nephritis induction; belimumab as adjunct. Strict sun protection. Monitor CH50, C3, C4, anti-dsDNA, and urine PCR as disease activity markers. Counsel regarding familial SLE risk — C4 null allele status can be discussed with an immunologist for first-degree relatives. Avoid oestrogen-containing contraception (thrombosis risk in SLE).</p>\n\n[[Return to Clinical Notes Menu|Clinical-Notes-Menu]]",

"Clinical-Case-5": "<div class=\"section-label clinical\">Clinical Case Study</div>\n<h1>Case 5: C5 Deficiency <small>[Terminal complement / MAC deficiency]</small></h1>\n<p><strong>Patient Profile:</strong> Male, 19 years old — recurrent <em>Neisseria meningitidis</em> infections.</p>\n\n<div class=\"key-box\">\n<strong>Pathway Blockade Site</strong><br>\nC1 → C4 → C2 → C3 → <strong>C5 [BLOCKED]</strong> → C6 → C7 → C8 → C9 (MAC)\n</div>\n\n<h2>Clinical Presentation</h2>\n<p>A 19-year-old male university student is admitted for his <strong>second episode of bacterial meningitis</strong> in three years. Both episodes were caused by <em>Neisseria meningitidis</em> (serogroup B on the first occasion, serogroup Y now). He received MenACWY vaccination at age 14 and was fully vaccinated — recurrent disease despite vaccination prompted immunological investigation.</p>\n<p>On admission he is febrile (40.1°C), photophobic, and has a <strong>petechial rash</strong> over the trunk and legs. He is alert but has marked neck stiffness. A paternal uncle reportedly died from ‘meningococcal septicaemia’ at age 22. Blood cultures and CSF culture confirm <em>N. meningitidis</em> serogroup Y.</p>\n\n<h2>Laboratory Findings</h2>\n<div class=\"table-scroll\">\n<table class=\"clinical-table\">\n  <tr><th>Test</th><th>Result</th><th>Reference</th></tr>\n  <tr><td>CH50 (haemolytic complement)</td><td><strong>Undetectable (0%)</strong></td><td>70–130%</td></tr>\n  <tr><td>AP50 (alternative pathway haemolysis)</td><td><strong>Undetectable (0%)</strong></td><td>75–135%</td></tr>\n  <tr><td>C3</td><td><strong>Normal (1.1 g/L)</strong></td><td>0.9–1.8 g/L</td></tr>\n  <tr><td>C4</td><td>Normal</td><td>0.16–0.38 g/L</td></tr>\n  <tr><td>C5 antigen (nephelometry)</td><td><strong>Absent (&lt;2% of normal)</strong></td><td>Present</td></tr>\n  <tr><td>C1q, C2, Factor B</td><td>Normal</td><td>—</td></tr>\n  <tr><td>FBC</td><td>Leukocytosis (21 × 10⁹/L), neutrophilia</td><td>4–11 × 10⁹/L</td></tr>\n  <tr><td>CRP</td><td>228 mg/L</td><td>&lt;5 mg/L</td></tr>\n</table>\n</div>\n\n<h2>Interpretation</h2>\n<div class=\"key-box\">\n<strong>1. Both CH50 and AP50 are undetectable</strong> — terminal complement components (C5–C9) are <em>shared</em> between all pathways; deficiency of any one of them abolishes both assays simultaneously.\n</div>\n<div class=\"key-box\">\n<strong>2. C3 is normal</strong> — this is the critical distinguishing feature from <strong>C3 deficiency</strong>, which also shows zero CH50 and AP50. In MAC deficiency, all upstream components function normally; the block is at the terminal step.\n</div>\n<div class=\"key-box\">\n<strong>3. Selective susceptibility to <em>Neisseria</em></strong> — the MAC is the primary mechanism for killing Gram-negative diplococci, which have thin peptidoglycan walls easily penetrated by the pore. Gram-positive bacteria (e.g. <em>Staphylococcus aureus</em>) have thick cell walls resistant to the MAC; they are cleared by opsonisation and phagocytosis, which remain intact here.\n</div>\n\n<h2>Diagnosis and Management</h2>\n<p><strong>Diagnosis:</strong> Autosomal recessive C5 deficiency (confirmed by absent C5 antigen and normal C3/C4).</p>\n<p><strong>Management:</strong> Long-term prophylactic penicillin V; vaccination against all <em>Neisseria</em> serogroups; family screening.</p>\n\n[[← Return to Clinical Notes Menu|Clinical-Notes-Menu]]",

"Clinical-Diagnostic-Summary": "<div class=\"section-label clinical\">Diagnostic Summary</div>\n<h2>CH50 vs AP50 Dissociation Analysis</h2>\n<p>Evaluating the mathematical divergence between the Classical Line (CH50) and Alternative Line (AP50) performance allows for highly specific mapping of patient pathology before advanced assays begin.</p>\n\n<div class=\"table-scroll\">\n<table class=\"clinical-table\">\n  <thead>\n    <tr><th>Deficiency</th><th>CH50</th><th>AP50</th><th>Clinical Correlate</th></tr>\n  </thead>\n  <tbody>\n    <tr><td><strong>C1q, C1r, C1s, C2, C4</strong></td><td>0 / Absent</td><td>Normal</td><td>SLE-like autoimmunity, encapsulated bacterial infections</td></tr>\n    <tr><td><strong>Factor B, Factor D, Properdin</strong></td><td>Normal</td><td>0 / Absent</td><td>Neisserial and pyogenic infections</td></tr>\n    <tr><td><strong>C3</strong></td><td>0 / Absent</td><td>0 / Absent</td><td>Severe recurrent pyogenic infections</td></tr>\n    <tr><td><strong>C5, C6, C7, C8, C9</strong></td><td>0 / Absent</td><td>0 / Absent</td><td>Recurrent Neisserial infections (Normal C3)</td></tr>\n  </tbody>\n</table>\n</div>\n<br>\n[[← Return to Clinical Notes Menu|Clinical-Notes-Menu]]",

"Retrieval-Intro": "<div class=\"section-label shared\">Self-Assessment</div>\n<h2>MCQ Knowledge Test</h2>\n<p>Test your understanding across all complement pathways and clinical correlations.</p>\n<p>Which complement component is common to the Classical, Alternative, and Lectin pathways?</p>\n\n[[A) C1q|Retrieval-Q1-Incorrect]]\n[[B) C3|Retrieval-Q1-Correct]]\n[[C) Factor B|Retrieval-Q1-Incorrect]]",

/* ── Execution Engine ────────────────────────────────────── */
const historyStack = [];

function parseWikiLinks(text) {
    return text.replace(/\[\[(.*?)(?:\|(.*?))?\]\]/g, (match, p1, p2) => {
        const displayText = p2 ? p1 : p1;
        const targetPassage = p2 ? p2 : p1;
        
        let linkClass = "link-internal";
        if (targetPassage.includes("Correct") || targetPassage.includes("Incorrect") || displayText.match(/^[A-D]\)/)) {
            linkClass += " link-answer";
        } else if (displayText.includes("Continue") || displayText.includes("Next")) {
            linkClass += " link-continue";
        }

        return `<a class="${linkClass}" data-target="${targetPassage.trim()}">${displayText.trim()}</a>`;
    });
}

function renderPassage(passageKey, addHistory = true) {
    const container = document.getElementById('passage-container');
    const content = PASSAGES[passageKey];

    if (!content) {
        container.innerHTML = `
            <div class="passage">
                <h2>Error</h2>
                <div class="feedback-incorrect">
                    Passage not found: <strong>${passageKey}</strong>
                </div>
                <a class="back-btn" onclick="renderPassage('Start-Complement')">← Return to Main Menu</a>
            </div>
        `;
        return;
    }

    if (addHistory) {
        if (historyStack.length === 0 || historyStack[historyStack.length - 1] !== passageKey) {
            historyStack.push(passageKey);
        }
    }

    const html = parseWikiLinks(content);
    container.innerHTML = `<div class="passage">${html}</div>`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.addEventListener('DOMContentLoaded', () => {
    const modal = document.getElementById('student-modal');
    const sidInput = document.getElementById('sid-input');
    const sidBtn = document.getElementById('sid-btn');
    const sidErr = document.getElementById('sid-errtxt');

    function startApp() {
        const val = sidInput.value.trim();
        if (/^\d{5}$/.test(val)) {
            modal.style.display = 'none';
            renderPassage('Start-Complement');
        } else {
            sidInput.classList.add('sid-error');
            sidErr.textContent = 'Please enter a valid 5-digit lab code.';
            setTimeout(() => sidInput.classList.remove('sid-error'), 400);
        }
    }

    sidBtn.addEventListener('click', startApp);
    sidInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') startApp();
    });

    document.getElementById('passage-container').addEventListener('click', (e) => {
        const link = e.target.closest('[data-target]');
        if (link) {
            e.preventDefault();
            const target = link.getAttribute('data-target');
            if (target) {
                renderPassage(target);
            }
        }
    });
});
</script>
