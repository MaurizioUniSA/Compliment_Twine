"Regulation_Q2_Incorrect_PNH": "<div class=\"section-label regulation\">Regulation</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> PNH is caused by somatic mutations in <em>PIGA</em>, causing deficiency of GPI-anchored surface proteins CD55 and CD59.\n</div>\n[[← Try again|Regulation_SolubleRegulators]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Regulation_Q2_Incorrect_aHUS": "<div class=\"section-label regulation\">Regulation</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> aHUS is typically caused by mutations in alternative pathway regulators (Factor H, Factor I, or CD46/MCP).\n</div>\n[[← Try again|Regulation_SolubleRegulators]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Regulation_Q2_Correct_HAE": "<div class=\"section-label regulation\">Regulation</div>\n<div class=\"feedback-correct\">\n<strong>Correct!</strong> C1-INH deficiency causes <strong>Hereditary Angioedema (HAE)</strong>. Unregulated kallikrein overproduces <strong>bradykinin</strong>, leading to recurrent episodes of non-pruritic, life-threatening laryngeal and subcutaneous angioedema.\n</div>\n[[Continue → Factor H & Alternative Pathway Control|Regulation_FactorH]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Regulation_FactorH": "<div class=\"section-label regulation\">Regulation</div>\n<div class=\"progress-label\">Regulation · Step 3 of 4</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:75%\"></div></div>\n\n<h2>Factor H: Controlling Alternative Amplification</h2>\n<p><strong>Factor H</strong> is a key fluid-phase regulator that preferentially binds to sialic acid and glycosaminoglycans on self host cells:</p>\n<div class=\"key-box\">\n1. Competes with Factor B for binding to surface C3b<br>\n2. <strong>Decay-accelerating activity:</strong> Displaces Bb from assembled C3bBb<br>\n3. <strong>Cofactor activity:</strong> Enables the serine protease <strong>Factor I</strong> to cleave C3b into inactive iC3b\n</div>\n\n\n<p><em>Which partner enzyme executes the permanent proteolytic cleavage of C3b in the presence of Factor H?</em></p>\n\n[[A) Factor D|Regulation-Q3-Incorrect-FactorD]]\n[[B) Properdin|Regulation-Q3-Incorrect-Properdin]]\n[[C) Factor I|Regulation_Q3_Correct_FactorI]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Regulation-Q3-Incorrect-FactorD": "<div class=\"section-label regulation\">Regulation</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> Factor D cleaves Factor B to activate the alternative pathway convertase; it does not inactivate C3b.\n</div>\n[[← Try again|Regulation_FactorH]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Regulation-Q3-Incorrect-Properdin": "<div class=\"section-label regulation\">Regulation</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> Properdin is the positive stabilizer of the C3bBb complex.\n</div>\n[[← Try again|Regulation_FactorH]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Regulation_Q3_Correct_FactorI": "<div class=\"section-label regulation\">Regulation</div>\n<div class=\"feedback-correct\">\n<strong>Correct!</strong> <strong>Factor I</strong> is the circulating serine protease that cleaves C3b into inactive iC3b (and C4b into C4c/C4d), but it can only do so in the presence of cofactor proteins: Factor H, MCP (CD46) or CR1 for C3b, and C4BP, MCP or CR1 for C4b.\n</div>\n[[Continue → Cell-Bound Regulators & MAC Inhibition|Regulation_CellBound]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Regulation_CellBound": "<div class=\"section-label regulation\">Regulation</div>\n<div class=\"progress-label\">Regulation · Step 4 of 4</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:100%\"></div></div>\n\n<h2>Cell-Bound Regulators &amp; Terminal Pore Control</h2>\n<p>Host membranes express specialized surface-anchored regulators:</p>\n<div class=\"key-box\">\n<strong>DAF (CD55, Decay-Accelerating Factor):</strong> Dissociates C4b2a and C3bBb convertases on host membranes.<br>\n<strong>MCP (CD46, Membrane Cofactor Protein):</strong> Membrane-bound cofactor for Factor I-mediated cleavage of C3b and C4b.<br>\n<strong>CD59 (Protectin):</strong> GPI-anchored membrane protein that physically blocks the terminal pathway.\n</div>\n\n<div class=\"diagram-container\"><img src=\"C'_Images/Slide10.PNG\" alt=\"DAF (CD55) accelerating decay of the C4b2a and C3bBb convertases\" class=\"diagram-img\"></div>\n<div class=\"diagram-container\"><img src=\"C'_Images/Slide11.PNG\" alt=\"MCP (CD46) and Factor I cofactor activity cleaving C3b and C4b\" class=\"diagram-img\"></div>\n<div class=\"diagram-container\"><img src=\"C'_Images/Slide12.PNG\" alt=\"CD59 (Protectin) blocking C9 binding and polymerisation to inhibit the MAC\" class=\"diagram-img\"></div>\n\n<p><em>By what specific mechanism does CD59 prevent osmotic lysis of host cells?</em></p>\n\n[[A) It binds C5b-8 and prevents the incorporation and polymerisation of C9|Regulation-Q4-Correct-CD59]]\n[[B) It accelerates the decay of C4b2a convertases on host surfaces|Regulation-Q4-Incorrect-DAFAction]]\n[[C) It cleaves C5a into an inactive peptide|Regulation-Q4-Incorrect-C5aCarboxy]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Regulation-Q4-Incorrect-DAFAction": "<div class=\"section-label regulation\">Regulation</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> Accelerating convertase decay is the specific function of DAF (CD55), not CD59.\n</div>\n[[← Try again|Regulation_CellBound]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Regulation-Q4-Incorrect-C5aCarboxy": "<div class=\"section-label regulation\">Regulation</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> Carboxypeptidase N in serum cleaves C5a into C5a-des-Arg, not CD59.\n</div>\n[[← Try again|Regulation_CellBound]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Regulation-Q4-Correct-CD59": "<div class=\"section-label regulation\">Regulation</div>\n<div class=\"feedback-correct\">\n<strong>Correct!</strong> <strong>CD59 (Protectin)</strong> embeds in host membranes and binds the assembling C5b-8 complex, physically preventing C9 molecules from unrolling, polymerising, and punching a transmembrane pore.\n</div>\n<div class=\"notice-box\"><strong>Clinical Milestone:</strong> In PNH, clonal deficiency of the GPI anchor eliminates both CD55 and CD59 from red cell membranes, allowing unchecked MAC lysis and chronic intravascular haemolytic anaemia.</div>\n[[Continue → Regulation Summary|Regulation_Summary]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Regulation_Summary": "<div class=\"section-label regulation\">Summary</div>\n<h2>Complement Regulation: Summary</h2>\n<p>You have mastered the multi-tiered control networks of the complement system.</p>\n\n<div class=\"diagram-container\"><img src=\"C'_Images/Slide13.PNG\" alt=\"Carboxypeptidases N, B and R inactivating the anaphylatoxins C3a and C5a\" class=\"diagram-img\"></div>\n\n<div class=\"key-box\">\n<strong>1. Early Initiation Control:</strong> C1-INH permanently inactivates C1r, C1s, and MASP-1/2.<br>\n<strong>2. Convertase Decay &amp; Inactivation:</strong><br>\n• <strong>DAF (CD55):</strong> Dissociates pre-formed convertases (C4b2a and C3bBb).<br>\n• <strong>Factor H:</strong> Soluble decay accelerator and Factor I cofactor on sialic acid-rich surfaces.<br>\n• <strong>MCP (CD46):</strong> Surface membrane cofactor for Factor I cleavage of C3b/C4b.<br>\n• <strong>Factor I:</strong> Serine protease cleaving C3b → inactive iC3b.<br>\n<strong>3. Terminal Lysis Blockade:</strong> CD59 binds C5b-8 and stops C9 polymerisation.<br>\n<strong>4. Anaphylatoxin Inactivation:</strong> Carboxypeptidases N, B and R remove the C-terminal arginine from C3a and C5a (forming C3a-desArg and C5a-desArg), reducing their inflammatory activity.\n</div>\n[[Return to Main Menu|Start-Complement]]",

"Retrieval-Intro": "<div class=\"section-label shared\">Retrieval Practice</div>\n<h2>Test Yourself: Retrieval Practice</h2>\n<p>This 10-question self-test is designed to reinforce your recall of pathway components, enzymology, and clinical correlations. An effortful retrieval attempt before viewing answer options strengthens memory retention.</p>\n<div class=\"key-box\">\n<strong>Learning Tip:</strong> Read each question stem carefully and formulate the answer in your mind before inspecting the choices.\n</div>\n<br>\n[[Start Retrieval Practice (Question 1 of 10)|Retrieval-Q1]]",

"Retrieval-Q1": "<div class=\"section-label shared\">Classical Pathway</div>\n<div class=\"progress-label\">Retrieval Practice · Question 1 of 10</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:0%\"></div></div>\n\n<h2>Within the multi-protein C1 complex, which statement accurately outlines the distinct functional roles of C1q, C1r, and C1s?</h2>\n\n[[A) C1q cleaves C4; C1r recognises antibody Fc; C1s cleaves C2|Retrieval-Q1-Wrong-1]]\n[[B) C1q recognises antibody Fc; C1r activates C1s; C1s cleaves C4 and C2|Retrieval-Q1-Correct]]\n[[C) C1s recognises antigen; C1r cleaves C4; C1q activates C3 directly|Retrieval-Q1-Wrong-2]]\n[[D) All three subunits possess identical serine protease activity targeting C3|Retrieval-Q1-Wrong-3]]",

"Retrieval-Q1-Correct": "<div class=\"section-label shared\">Classical Pathway</div>\n<div class=\"feedback-correct\"><strong>Correct!</strong></div>\n<div class=\"key-box\">\n<strong>C1q:</strong> Recognition subunit; binds IgM or clustered IgG Fc regions.<br>\n<strong>C1r:</strong> Serine protease; autoactivates upon C1q binding, then cleaves C1s.<br>\n<strong>C1s:</strong> Active serine protease; cleaves native C4, then C2.\n</div>\n[[Next Question →|Retrieval-Q2]]",

"Retrieval-Q1-Wrong-1": "<div class=\"section-label shared\">Classical Pathway</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> C1q has no catalytic or enzymatic domain; C1s cleaves both C4 and C2.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> C1q recognises antibody Fc; C1r activates C1s; C1s cleaves C4 and C2.</div>\n[[Next Question →|Retrieval-Q2]]",

"Retrieval-Q1-Wrong-2": "<div class=\"section-label shared\">Classical Pathway</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> C1q is the recognition subunit; C1s is the effector protease.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> C1q recognises antibody Fc; C1r activates C1s; C1s cleaves C4 and C2.</div>\n[[Next Question →|Retrieval-Q2]]",

"Retrieval-Q1-Wrong-3": "<div class=\"section-label shared\">Classical Pathway</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> Only C1r and C1s are serine proteases, and neither cleaves C3 directly.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> C1q recognises antibody Fc; C1r activates C1s; C1s cleaves C4 and C2.</div>\n[[Next Question →|Retrieval-Q2]]",

"Retrieval-Q2": "<div class=\"section-label shared\">Classical Pathway</div>\n<div class=\"progress-label\">Retrieval Practice · Question 2 of 10</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:10%\"></div></div>\n\n<h2>How does the classical pathway C3 convertase assemble, and what is unusual regarding C2 nomenclature?</h2>\n\n[[A) C4b anchors to the surface; C2 binds C4b and is cleaved by C1s into C2b (released) and C2a (bound catalytic fragment)|Retrieval-Q2-Correct]]\n[[B) C2 is cleaved by C1q into C2a (small) and C2b (large); C4b2b forms the convertase|Retrieval-Q2-Wrong-1]]\n[[C) C4a binds surface Factor B; Factor D cleaves it to form C4aBb|Retrieval-Q2-Wrong-2]]\n[[D) C4b2a forms entirely in free plasma solution without attaching to surfaces|Retrieval-Q2-Wrong-3]]",

"Retrieval-Q2-Correct": "<div class=\"section-label shared\">Classical Pathway</div>\n<div class=\"feedback-correct\"><strong>Correct!</strong></div>\n<div class=\"key-box\">\nC4b anchors covalently to the target surface. C2 binds C4b and is cleaved by C1s. By historical convention, <strong>C2a is the larger catalytic fragment</strong> that remains bound to form <strong>C4b2a</strong>, while C2b is released.</div>\n[[Next Question →|Retrieval-Q3]]",

"Retrieval-Q2-Wrong-1": "<div class=\"section-label shared\">Classical Pathway</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> C1q has no protease activity (C1s performs the cleavage), and in standard nomenclature C2a is the larger fragment that stays bound.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> C4b anchors to the surface; C2 binds C4b and is cleaved by C1s into C2b (released) and C2a (bound catalytic fragment).</div>\n[[Next Question →|Retrieval-Q3]]",

"Retrieval-Q2-Wrong-2": "<div class=\"section-label shared\">Classical Pathway</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> Factor B and Factor D belong to the alternative pathway, not the classical pathway.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> C4b anchors to the surface; C2 binds C4b and is cleaved by C1s into C2b (released) and C2a (bound catalytic fragment).</div>\n[[Next Question →|Retrieval-Q3]]",

"Retrieval-Q2-Wrong-3": "<div class=\"section-label shared\">Classical Pathway</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> C4b must anchor covalently to the target membrane via its thioester bond; unanchored C4b rapidly hydrolyses and is inactivated.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> C4b anchors to the surface; C2 binds C4b and is cleaved by C1s into C2b (released) and C2a (bound catalytic fragment).</div>\n[[Next Question →|Retrieval-Q3]]",

"Retrieval-Q3": "<div class=\"section-label shared\">Alternative Pathway</div>\n<div class=\"progress-label\">Retrieval Practice · Question 3 of 10</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:20%\"></div></div>\n\n<h2>Which mechanism explains why continuous alternative pathway 'C3 tick-over' does not routinely damage healthy host erythrocytes?</h2>\n\n[[A) C3 tick-over can only occur in the presence of Gram-negative bacterial lipopolysaccharide|Retrieval-Q3-Wrong-1]]\n[[B) Healthy host membranes express regulators like DAF and bind Factor H to rapidly inactivate deposited C3b|Retrieval-Q3-Correct]]\n[[C) Human red blood cells lack surface water molecules required for C3 hydrolysis|Retrieval-Q3-Wrong-2]]\n[[D) Factor D is exclusively active inside lymph nodes and excluded from the systemic circulation|Retrieval-Q3-Wrong-3]]",

"Retrieval-Q3-Correct": "<div class=\"section-label shared\">Alternative Pathway</div>\n<div class=\"feedback-correct\"><strong>Correct!</strong></div>\n<div class=\"key-box\">\nHost cells carry surface glycoproteins rich in sialic acid that recruit soluble <strong>Factor H</strong>, and express membrane <strong>DAF (CD55)</strong> and <strong>MCP (CD46)</strong>. These factors disassemble convertases and facilitate Factor I cleavage of C3b into inactive iC3b.</div>\n[[Next Question →|Retrieval-Q4]]",

"Retrieval-Q3-Wrong-1": "<div class=\"section-label shared\">Alternative Pathway</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> C3 tick-over is spontaneous and basal, occurring constantly in normal plasma without microbial triggers.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> Healthy host membranes express regulators like DAF and bind Factor H to rapidly inactivate deposited C3b.</div>\n[[Next Question →|Retrieval-Q4]]",

"Retrieval-Q3-Wrong-2": "<div class=\"section-label shared\">Alternative Pathway</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> Hydrolysis of C3 occurs in the aqueous plasma fluid phase, not on the red cell membrane.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> Healthy host membranes express regulators like DAF and bind Factor H to rapidly inactivate deposited C3b.</div>\n[[Next Question →|Retrieval-Q4]]",

"Retrieval-Q3-Wrong-3": "<div class=\"section-label shared\">Alternative Pathway</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> Factor D circulates constitutively throughout systemic blood plasma.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> Healthy host membranes express regulators like DAF and bind Factor H to rapidly inactivate deposited C3b.</div>\n[[Next Question →|Retrieval-Q4]]",

"Retrieval-Q4": "<div class=\"section-label shared\">Alternative Pathway</div>\n<div class=\"progress-label\">Retrieval Practice · Question 4 of 10</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:30%\"></div></div>\n\n<h2>How do the functions of Properdin (Factor P) and Factor H contrast in regulating the alternative pathway?</h2>\n\n[[A) Both molecules act as cofactors for Factor I-mediated cleavage of C3b|Retrieval-Q4-Wrong-1]]\n[[B) Properdin cleaves Factor B, whereas Factor H cleaves native C3|Retrieval-Q4-Wrong-2]]\n[[C) Properdin binds and stabilizes C3bBb (positive regulator); Factor H accelerates convertase decay and aids C3b inactivation (negative regulator)|Retrieval-Q4-Correct]]\n[[D) Properdin inhibits terminal MAC pores, whereas Factor H activates C1q|Retrieval-Q4-Wrong-3]]",

"Retrieval-Q4-Correct": "<div class=\"section-label shared\">Alternative Pathway</div>\n<div class=\"feedback-correct\"><strong>Correct!</strong></div>\n<div class=\"key-box\">\n<strong>Properdin:</strong> Sole positive regulator; binds C3bBb, extending its half-life ~10-fold.<br>\n<strong>Factor H:</strong> Negative regulator; displaces Bb from convertases and serves as a cofactor for Factor I to cleave C3b → inactive iC3b.</div>\n[[Next Question →|Retrieval-Q5]]",

"Retrieval-Q4-Wrong-1": "<div class=\"section-label shared\">Alternative Pathway</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> Properdin does not assist Factor I; it actively protects and stabilizes the active convertase.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> Properdin binds and stabilizes C3bBb (positive regulator); Factor H accelerates convertase decay and aids C3b inactivation (negative regulator).</div>\n[[Next Question →|Retrieval-Q5]]",

"Retrieval-Q4-Wrong-2": "<div class=\"section-label shared\">Alternative Pathway</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> Neither protein is a protease. Factor D cleaves Factor B, and convertases cleave C3.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> Properdin binds and stabilizes C3bBb (positive regulator); Factor H accelerates convertase decay and aids C3b inactivation (negative regulator).</div>\n[[Next Question →|Retrieval-Q5]]",

"Retrieval-Q4-Wrong-3": "<div class=\"section-label shared\">Alternative Pathway</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> CD59 inhibits MAC pores, and C1q is initiated by antibodies, not Factor H.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> Properdin binds and stabilizes C3bBb (positive regulator); Factor H accelerates convertase decay and aids C3b inactivation (negative regulator).</div>\n[[Next Question →|Retrieval-Q5]]",

"Retrieval-Q5": "<div class=\"section-label shared\">Lectin Pathway</div>\n<div class=\"progress-label\">Retrieval Practice · Question 5 of 10</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:40%\"></div></div>\n\n<h2>In the lectin pathway, how is MASP-2 activated, and what are its direct catalytic substrates?</h2>\n\n[[A) MASP-2 autoactivates on contact with albumin and directly cleaves C5|Retrieval-Q5-Wrong-1]]\n[[B) MBL/ficolin carbohydrate binding triggers MASP-1 autoactivation; MASP-1 cleaves MASP-2; active MASP-2 cleaves C4 and C2|Retrieval-Q5-Correct]]\n[[C) MASP-2 is cleaved by circulating Factor D and then cleaves Factor B|Retrieval-Q5-Wrong-2]]\n[[D) MASP-2 binds bacterial peptidoglycan directly and polymerises C9|Retrieval-Q5-Wrong-3]]",

"Retrieval-Q5-Correct": "<div class=\"section-label shared\">Lectin Pathway</div>\n<div class=\"feedback-correct\"><strong>Correct!</strong></div>\n<div class=\"key-box\">\nMBL/ficolin engagement causes conformational changes activating <strong>MASP-1</strong>, which cleaves and activates <strong>MASP-2</strong>. MASP-2 then cleaves C4 and C2 to form the C4b2a convertase.</div>\n[[Next Question →|Retrieval-Q6]]",

"Retrieval-Q5-Wrong-1": "<div class=\"section-label shared\">Lectin Pathway</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> Albumin is an inert plasma carrier; MASP-2 acts upstream on C4 and C2, not C5.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> MBL/ficolin carbohydrate binding triggers MASP-1 autoactivation; MASP-1 cleaves MASP-2; active MASP-2 cleaves C4 and C2.</div>\n[[Next Question →|Retrieval-Q6]]",

"Retrieval-Q5-Wrong-2": "<div class=\"section-label shared\">Lectin Pathway</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> Factor D and Factor B belong strictly to the alternative pathway.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> MBL/ficolin carbohydrate binding triggers MASP-1 autoactivation; MASP-1 cleaves MASP-2; active MASP-2 cleaves C4 and C2.</div>\n[[Next Question →|Retrieval-Q6]]",

"Retrieval-Q5-Wrong-3": "<div class=\"section-label shared\">Lectin Pathway</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> MASP-2 is an early serine protease, not a terminal pore component.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> MBL/ficolin carbohydrate binding triggers MASP-1 autoactivation; MASP-1 cleaves MASP-2; active MASP-2 cleaves C4 and C2.</div>\n[[Next Question →|Retrieval-Q6]]",

"Retrieval-Q6": "<div class=\"section-label shared\">Lectin & Classical Analogies</div>\n<div class=\"progress-label\">Retrieval Practice · Question 6 of 10</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:50%\"></div></div>\n\n<h2>Why are C1q and MBL/ficolins described as structural and functional analogues?</h2>\n\n[[A) Both are monomeric proteases that directly cleave C3 in the circulation|Retrieval-Q6-Wrong-1]]\n[[B) Both assemble into intracellular transcription factors regulating interferon release|Retrieval-Q6-Wrong-2]]\n[[C) Both are multimeric pattern-recognition complexes that pair with serine proteases to assemble identical C4b2a convertases|Retrieval-Q6-Correct]]\n[[D) Both bind exclusively to viral RNA genomes on host ribosomes|Retrieval-Q6-Wrong-3]]",

"Retrieval-Q6-Correct": "<div class=\"section-label shared\">Lectin & Classical Analogies</div>\n<div class=\"feedback-correct\"><strong>Correct!</strong></div>\n<div class=\"key-box\">\nBoth display multimeric 'bouquet' architectures with collagen-like stalks and globular recognition heads. C1q pairs with C1r/C1s, while MBL/ficolins pair with MASP-1/MASP-2. Both pathways generate the <strong>identical C3 convertase (C4b2a)</strong>.</div>\n[[Next Question →|Retrieval-Q7]]",

"Retrieval-Q6-Wrong-1": "<div class=\"section-label shared\">Lectin & Classical Analogies</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> Neither molecule is a protease, nor are they monomeric.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> Both are multimeric pattern-recognition complexes that pair with serine proteases to assemble identical C4b2a convertases.</div>\n[[Next Question →|Retrieval-Q7]]",

"Retrieval-Q6-Wrong-2": "<div class=\"section-label shared\">Lectin & Classical Analogies</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> Complement recognition complexes operate in extracellular fluids and on cell surfaces.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> Both are multimeric pattern-recognition complexes that pair with serine proteases to assemble identical C4b2a convertases.</div>\n[[Next Question →|Retrieval-Q7]]",

"Retrieval-Q6-Wrong-3": "<div class=\"section-label shared\">Lectin & Classical Analogies</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> They recognize surface-displayed Fc domains or carbohydrates, not intracellular RNA.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> Both are multimeric pattern-recognition complexes that pair with serine proteases to assemble identical C4b2a convertases.</div>\n[[Next Question →|Retrieval-Q7]]",

"Retrieval-Q7": "<div class=\"section-label shared\">Terminal Pathway & MAC</div>\n<div class=\"progress-label\">Retrieval Practice · Question 7 of 10</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:60%\"></div></div>\n\n<h2>What is the precise sequence of assembly from C5 cleavage to the completed Membrane Attack Complex?</h2>\n\n[[A) C5 convertase cleaves C5 → C5a + C5b; C5b sequentially binds C6, C7 (membrane insertion), C8, and 12–18 C9 monomers to form the pore|Retrieval-Q7-Correct]]\n[[B) C5 convertase cleaves C5b into C5a; C5a polymerises directly with C8 to create a channel|Retrieval-Q7-Wrong-1]]\n[[C) C5b inserts into the membrane first, then recruits C8, C7, and C6 in reverse order|Retrieval-Q7-Wrong-2]]\n[[D) C5 convertase cleaves C9 directly, which spontaneously multimerises without C5b, C6, C7, or C8|Retrieval-Q7-Wrong-3]]",

"Retrieval-Q7-Correct": "<div class=\"section-label shared\">Terminal Pathway & MAC</div>\n<div class=\"feedback-correct\"><strong>Correct!</strong></div>\n<div class=\"key-box\">\n1. C5 cleaved → C5b + C5a (released).<br>\n2. C5b binds C6 → C5b-6.<br>\n3. C5b-6 binds C7 → C5b-7 inserts into the membrane lipid bilayer.<br>\n4. C8 binds → C5b-8 punctures a small 10 Å leak.<br>\n5. Multiple C9 molecules (12–18) polymerise → C5b-9 full 100 Å pore.</div>\n[[Next Question →|Retrieval-Q8]]",

"Retrieval-Q7-Wrong-1": "<div class=\"section-label shared\">Terminal Pathway & MAC</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> C5a is the soluble anaphylatoxin; C5b is the fragment that anchors MAC assembly.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> C5 convertase cleaves C5 → C5a + C5b; C5b sequentially binds C6, C7 (membrane insertion), C8, and 12–18 C9 monomers to form the pore.</div>\n[[Next Question →|Retrieval-Q8]]",

"Retrieval-Q7-Wrong-2": "<div class=\"section-label shared\">Terminal Pathway & MAC</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> C5b cannot insert into membranes alone; membrane insertion requires C7.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> C5 convertase cleaves C5 → C5a + C5b; C5b sequentially binds C6, C7 (membrane insertion), C8, and 12–18 C9 monomers to form the pore.</div>\n[[Next Question →|Retrieval-Q8]]",

"Retrieval-Q7-Wrong-3": "<div class=\"section-label shared\">Terminal Pathway & MAC</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> C9 is not cleaved by the C5 convertase; it polymerises in response to the C5b-8 nucleation complex.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> C5 convertase cleaves C5 → C5a + C5b; C5b sequentially binds C6, C7 (membrane insertion), C8, and 12–18 C9 monomers to form the pore.</div>\n[[Next Question →|Retrieval-Q8]]",

"Retrieval-Q8": "<div class=\"section-label shared\">Effector Outcomes</div>\n<div class=\"progress-label\">Retrieval Practice · Question 8 of 10</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:70%\"></div></div>\n\n<h2>Which matching correctly links the biological effector outcome with its primary complement mediator?</h2>\n\n[[A) Opsonisation: C5a; Chemotaxis: C3b; Lysis: Factor H|Retrieval-Q8-Wrong-1]]\n[[B) Opsonisation: C3b/iC3b; Chemotaxis: C5a/C3a; Lysis: C5b-9 (MAC)|Retrieval-Q8-Correct]]\n[[C) Opsonisation: Properdin; Chemotaxis: C1q; Lysis: C4a|Retrieval-Q8-Wrong-2]]\n[[D) Opsonisation: C9; Chemotaxis: Factor B; Lysis: C2a|Retrieval-Q8-Wrong-3]]",

"Retrieval-Q8-Correct": "<div class=\"section-label shared\">Effector Outcomes</div>\n<div class=\"feedback-correct\"><strong>Correct!</strong></div>\n<div class=\"key-box\">\n• <strong>Opsonisation:</strong> C3b and iC3b tag pathogens for phagocyte CR1/CR3.<br>\n• <strong>Chemotaxis &amp; Inflammation:</strong> Anaphylatoxins C5a &gt; C3a recruit and activate leukocytes.<br>\n• <strong>Lysis:</strong> The C5b-9 MAC pore disrupts target cell osmotic integrity.</div>\n[[Next Question →|Retrieval-Q9]]",

"Retrieval-Q8-Wrong-1": "<div class=\"section-label shared\">Effector Outcomes</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> Roles are scrambled: C3b is the opsonin, C5a is the chemoattractant, and MAC causes lysis.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> Opsonisation: C3b/iC3b; Chemotaxis: C5a/C3a; Lysis: C5b-9 (MAC).</div>\n[[Next Question →|Retrieval-Q9]]",

"Retrieval-Q8-Wrong-2": "<div class=\"section-label shared\">Effector Outcomes</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> Properdin stabilizes convertases; C1q recognizes antibodies; C4a is a weak anaphylatoxin.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> Opsonisation: C3b/iC3b; Chemotaxis: C5a/C3a; Lysis: C5b-9 (MAC).</div>\n[[Next Question →|Retrieval-Q9]]",

"Retrieval-Q8-Wrong-3": "<div class=\"section-label shared\">Effector Outcomes</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> C9 forms pores; Factor B forms convertases; C2a is a convertase catalytic subunit.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> Opsonisation: C3b/iC3b; Chemotaxis: C5a/C3a; Lysis: C5b-9 (MAC).</div>\n[[Next Question →|Retrieval-Q9]]",

"Retrieval-Q9": "<div class=\"section-label shared\">Regulatory Mechanisms</div>\n<div class=\"progress-label\">Retrieval Practice · Question 9 of 10</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:80%\"></div></div>\n\n<h2>Which matching accurately pairs each complement regulator with its mechanism of action?</h2>\n\n[[A) C1-INH blocks C9 polymerisation; DAF activates Factor I; CD59 cleaves C4|Retrieval-Q9-Wrong-1]]\n[[B) Factor H cleaves C5; CD59 accelerates C3 convertase decay; C1-INH stabilizes properdin|Retrieval-Q9-Wrong-2]]\n[[C) All complement regulators act exclusively by hydrolysing fluid-phase C3|Retrieval-Q9-Wrong-3]]\n[[D) C1-INH inactivates C1r/s and MASPs; Factor H/I inactivate C3b; DAF accelerates convertase decay; CD59 blocks C9 polymerisation|Retrieval-Q9-Correct]]",

"Retrieval-Q9-Correct": "<div class=\"section-label shared\">Regulatory Mechanisms</div>\n<div class=\"feedback-correct\"><strong>Correct!</strong></div>\n<div class=\"key-box\">\n• <strong>C1-INH:</strong> Serpin that inactivates C1r, C1s, and MASP-1/2.<br>\n• <strong>Factor H + Factor I:</strong> Inactivate C3b into iC3b.<br>\n• <strong>DAF (CD55):</strong> Dissociates C3/C5 convertases on host membranes.<br>\n• <strong>CD59:</strong> Binds C5b-8 to block C9 pore polymerisation.</div>\n[[Next Question →|Retrieval-Q10]]",

"Retrieval-Q9-Wrong-1": "<div class=\"section-label shared\">Regulatory Mechanisms</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> CD59 blocks C9 polymerisation; C1-INH targets C1r/C1s/MASPs.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> C1-INH inactivates C1r/s and MASPs; Factor H/I inactivate C3b; DAF accelerates convertase decay; CD59 blocks C9 polymerisation.</div>\n[[Next Question →|Retrieval-Q10]]",

"Retrieval-Q9-Wrong-2": "<div class=\"section-label shared\">Regulatory Mechanisms</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> Factor H is not a protease; CD59 targets MAC assembly, not convertases.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> C1-INH inactivates C1r/s and MASPs; Factor H/I inactivate C3b; DAF accelerates convertase decay; CD59 blocks C9 polymerisation.</div>\n[[Next Question →|Retrieval-Q10]]",

"Retrieval-Q9-Wrong-3": "<div class=\"section-label shared\">Regulatory Mechanisms</div>\n<div class=\"feedback-incorrect\"><strong>Incorrect.</strong> Regulators act at multiple distinct steps: initiation, convertases, and terminal pore assembly.</div>\n<div class=\"key-box\"><strong>Correct answer:</strong> C1-INH inactivates C1r/s and MASPs; Factor H/I inactivate C3b; DAF accelerates convertase decay; CD59 blocks C9 polymerisation.</div>\n[[Next Question →|Retrieval-Q10]]",

"Retrieval-Q10": "<div class=\"section-label shared\">Clinical Diagnostics</div>\n<div class=\"progress-label\">Retrieval Practice · Question 10 of 10</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:90%\"></div></div>\n\n<h2>A 20-year-old presents with recurrent Neisseria meningitidis meningitis. Diagnostic testing reveals CH50 of 0 U/mL, AP50 of 0 U/mL, but normal serum C3 and C4 levels. What is the most likely underlying diagnosis?</h2>\n\n[[A) Homozygous C3 deficiency|Retrieval-Q10-Wrong-1]]\n[[B) Congenital terminal complement (MAC: C5–C9) deficiency|Retrieval-Q10-Correct]]\n[[C) Isolated C1q deficiency|Retrieval-Q10-Wrong-2]]\n[[D) C1-esterase inhibitor deficiency|Retrieval-Q10-Wrong-3]]",

"Retrieval-Q10-Correct": "<div class=\"section-label shared\">Clinical Diagnostics</div>\n<div class=\"feedback-correct\"><strong>Correct!</strong></div>\n<div class=\"key-box\">\n<strong>Terminal complement deficiency (C5, C6, C7, C8, or C9):</strong><br>\n• Both CH50 and AP50 require the MAC to lyse erythrocytes, so both read <strong>0 U/mL</strong>.<br>\n• Because upstream activation is intact, <strong>C3 and C4 remain normal</strong>.<br>\n• Failure of MAC pore formation causes selective vulnerability to invasive <em>Neisseria</em> infections.</div>\n[[Finish Retrieval Practice|Retrieval-Complete]]",

function parseLinks(text) {
  return text.replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g, (match, label, target) => {
    let extraClass = '';
    const cleanLabel = label.trim();
    if (/^[A-D]\)/.test(cleanLabel) || cleanLabel.startsWith('← Try again') || /^Retrieval-Q\d+-(Correct|Wrong)/.test(target.trim())) {
      extraClass = ' link-answer';
    } else if (cleanLabel.startsWith('Continue') || cleanLabel.startsWith('Next') || cleanLabel.startsWith('Start Retrieval') || cleanLabel.startsWith('Finish') || cleanLabel.startsWith('Return') || cleanLabel.startsWith('Explore') || cleanLabel.startsWith('Review') || cleanLabel.includes('Main Menu') || cleanLabel.startsWith('← Return')) {
      extraClass = ' link-continue';
    }
    return `<a class="link-internal${extraClass}" href="#" data-target="${target}">${cleanLabel}</a>`;
  });
}

// ===========================================================================
// Analytics: batched, retried, queued locally, sent to a Google Apps Script web app
// ===========================================================================
const ANALYTICS_CONFIG = {
  SCRIPT_URL: "PASTE_YOUR_APPS_SCRIPT_URL_HERE",   // the Web App /exec URL (see Code.gs)
  APP_VERSION: "complement-analytics-v6",
  HEARTBEAT_MS: 30000,          // running total of active time is logged this often
  IDLE_LIMIT_S: 60,             // active-time counter pauses after this many seconds without interaction
  FLUSH_DELAY_MS: 1500,         // events are batched for this long before sending
  BATCH_SIZE: 50,
  MAX_QUEUE: 2000,
  RETRY_BACKOFF_MS: [1000, 3000],   // retries inside one flush (plus one initial try)
  // Codes that are treated as test sessions (is_test = true). Instructor / test logins: "12345_EDUCATOR", "12345_TEST".
  TEST_CODES: ["12345", "99999", "00000", "11111"],
  // Optional: list every real allocated code, e.g. ["02210", "02211"]. Anything not in the list is flagged as a test session.
  ALLOCATED_CODES: null,
  DRY_RUN: false                // true = never send (used by the self-test)
};

const Analytics = (() => {
  const C = ANALYTICS_CONFIG;
  const QUEUE_KEY = "ct_analytics_queue_v1";
  const PREV_SESSION_KEY = "ct_analytics_prev_session";

  let session = null;               // { id, code, type, isTest, startedAt }
  let seq = 0;
  let queue = loadQueue();
  let connected = null;             // null = unknown, true, false
  let lastError = "";
  let flushing = false;
  let flushTimer = null;
  let retryTimer = null;
  let retryDelay = 15000;
  let captured = null;              // self-test: array that receives every event instead of the queue

  // active-time accounting
  let activeS = 0;
  let lastActivity = Date.now();
  let lastHeartbeatActive = -1;
  let pageKey = null, pageEnter = 0, pageActiveS = 0, viewNumber = 0;
  let lastKey = null;
  let lastUnloadFlush = 0;

  // counters that feed the Sessions row
  const cnt = {
    pagesViewed: 0, unique: new Set(), pathways: new Set(),
    questionsAnswered: 0, firstCorrect: 0, wrong: 0,
    mcqAnswered: 0, mcqScore: 0, mcqCompleted: false, reachedSummary: false
  };
  const attempts = {};              // question passage key -> attempts so far

  // ---------------- helpers ----------------
  function nowIso() { return new Date().toISOString(); }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  function loadQueue() {
    try { const q = JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]"); return Array.isArray(q) ? q : []; }
    catch (e) { return []; }
  }
  function saveQueue() {
    try {
      if (queue.length > C.MAX_QUEUE) queue = queue.slice(queue.length - C.MAX_QUEUE);
      localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
    } catch (e) { /* storage unavailable: keep the in-memory queue only */ }
  }

  function classifyCode(code) {
    const c = String(code);
    if (/_EDUCATOR$/i.test(c)) return { type: "instructor", isTest: true };
    if (/_TEST$/i.test(c) || C.TEST_CODES.indexOf(c) !== -1) return { type: "test", isTest: true };
    if (Array.isArray(C.ALLOCATED_CODES) && C.ALLOCATED_CODES.indexOf(c) === -1) return { type: "unlisted", isTest: true };
    return { type: "student", isTest: false };
  }

  function pathwayOf(key) {
    if (/^Retrieval-/.test(key)) return "retrieval";
    const p = (typeof PASSAGES !== "undefined" && PASSAGES[key]) || "";
    const m = p.match(/section-label ([a-z]+)/);
    return m ? m[1] : "";
  }

  // ---- answer classification (the SAME passage content that is shown to the student decides correctness) ----
  function isQuestionPassage(key) {
    const p = (typeof PASSAGES !== "undefined" && PASSAGES[key]) || "";
    return /\[\[[A-D]\) /.test(p);
  }
  function outcomeOfTarget(target) {
    const p = (typeof PASSAGES !== "undefined" && PASSAGES[target]) || "";
    if (p.indexOf("feedback-correct") !== -1) return true;
    if (p.indexOf("feedback-incorrect") !== -1) return false;
    return null;
  }
  function nameSaysCorrect(target) { return /(^|[-_])Correct([-_]|$)/.test(target); }
  function questionText(key) {
    const p = (typeof PASSAGES !== "undefined" && PASSAGES[key]) || "";
    const m = p.match(/<p><em>([\s\S]*?)<\/em><\/p>/) || p.match(/<h2>([\s\S]*?)<\/h2>/);
    return m ? m[1].replace(/<[^>]+>/g, "").trim().slice(0, 300) : key;
  }

  // ---------------- event creation ----------------
  function emit(type, data) {
    if (!session) return null;
    const ev = Object.assign({
      event_id: session.id + "-" + (++seq),
      type: type,
      ts: nowIso(),
      session_id: session.id,
      student_code: String(session.code),        // always text
      session_type: session.type,
      is_test: session.isTest
    }, data || {});
    if (captured) { captured.push(ev); return ev; }
    queue.push(ev);
    saveQueue();
    updateBadge();
    scheduleFlush(C.FLUSH_DELAY_MS);
    return ev;
  }

  function sessionSnapshot(reason) {
    return {
      last_seen_at: nowIso(),
      end_reason: reason,
      active_seconds: activeS,
      wall_seconds: Math.round((Date.now() - session.startedAt) / 1000),
      passages_viewed: cnt.pagesViewed,
      unique_passages: cnt.unique.size,
      pathways_visited: Array.from(cnt.pathways).join(";"),
      questions_answered: cnt.questionsAnswered,
      first_attempt_correct: cnt.firstCorrect,
      wrong_answers: cnt.wrong,
      mcq_answered: cnt.mcqAnswered,
      mcq_score: cnt.mcqScore,
      mcq_completed: cnt.mcqCompleted,
      reached_summary: cnt.reachedSummary,
      last_passage: pageKey || ""
    };
  }
  function emitSessionUpdate(reason) { if (session) emit("session_update", sessionSnapshot(reason)); }

  // ---------------- page + time tracking ----------------
  function emitPageSegment(reason) {
    if (!session || !pageKey) return;
    emit("time_on_page", {
      passage: pageKey,
      pathway: pathwayOf(pageKey),
      active_seconds: pageActiveS,
      wall_seconds: Math.round((Date.now() - pageEnter) / 1000),
      segment_reason: reason
    });
    pageActiveS = 0;
    pageEnter = Date.now();
  }

  function onRender(key, navType) {
    if (!session) { lastKey = key; return; }
    if (pageKey) emitPageSegment("navigate");
    const prev = pageKey || "";
    pageKey = key;
    pageEnter = Date.now();
    pageActiveS = 0;
    viewNumber++;
    cnt.pagesViewed++;
    cnt.unique.add(key);
    const pw = pathwayOf(key);
    if (pw) cnt.pathways.add(pw);
    emit("page_view", { passage: key, pathway: pw, prev_passage: prev, nav_type: navType || "link", view_number: viewNumber });
    if (key === "Retrieval-Complete") { cnt.mcqCompleted = true; emitSessionUpdate("mcq_completed"); }
    if (key === "Complement-Summary" || key === "Regulation_Summary") { cnt.reachedSummary = true; emitSessionUpdate("summary_reached"); }
    lastKey = key;
  }

  // Called for every link click BEFORE navigation. `fromKey` is the passage the click happened on.
  function onLinkClick(fromKey, target, label) {
    if (!session) return null;
    label = String(label || "").trim();
    if (!isQuestionPassage(fromKey) || !/^[A-D]\) /.test(label)) return null;

    const correct = outcomeOfTarget(target);            // same content that renders the green/red feedback box
    const byName = nameSaysCorrect(target);             // independent second signal (passage naming convention)
    const agree = (correct === byName);
    const isMcq = /^Retrieval-Q\d+$/.test(fromKey);
    const secondsOnQ = pageActiveS;
    const optionPos = label.charAt(0);
    const optionText = label.replace(/^[A-D]\) /, "");

    if (isMcq) {
      cnt.mcqAnswered++;
      if (correct === true) cnt.mcqScore++;
      return emit("mcq_result", {
        q_number: parseInt(fromKey.replace("Retrieval-Q", ""), 10),
        question_id: fromKey, question_text: questionText(fromKey),
        option_position: optionPos, option_text: optionText,
        destination_passage: target, correct: correct === true,
        dest_name_says_correct: byName, signals_agree: agree,
        score_so_far: cnt.mcqScore, seconds_on_question: secondsOnQ
      });
    }

    attempts[fromKey] = (attempts[fromKey] || 0) + 1;
    const attempt = attempts[fromKey];
    const firstAttemptCorrect = (attempt === 1 && correct === true);
    cnt.questionsAnswered++;
    if (firstAttemptCorrect) cnt.firstCorrect++;
    if (correct === false) cnt.wrong++;
    return emit("answer", {
      pathway: pathwayOf(fromKey),
      question_id: fromKey, question_text: questionText(fromKey),
      option_position: optionPos, option_text: optionText,
      destination_passage: target, correct: correct === true,
      dest_name_says_correct: byName, signals_agree: agree,
      attempt_number: attempt, first_attempt_correct: firstAttemptCorrect,
      seconds_on_question: secondsOnQ
    });
  }

  // ---------------- session lifecycle ----------------
  function startSession(code) {
    const cls = classifyCode(code);
    let prev = "";
    try { prev = sessionStorage.getItem(PREV_SESSION_KEY) || ""; } catch (e) {}
    session = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      code: String(code), type: cls.type, isTest: cls.isTest, startedAt: Date.now()
    };
    try { sessionStorage.setItem(PREV_SESSION_KEY, session.id); } catch (e) {}
    seq = 0; activeS = 0; lastActivity = Date.now(); lastHeartbeatActive = -1;
    pageKey = null; viewNumber = 0;
    Object.keys(attempts).forEach(k => delete attempts[k]);
    cnt.pagesViewed = 0; cnt.unique.clear(); cnt.pathways.clear();
    cnt.questionsAnswered = cnt.firstCorrect = cnt.wrong = cnt.mcqAnswered = cnt.mcqScore = 0;
    cnt.mcqCompleted = cnt.reachedSummary = false;
    emit("session_start", Object.assign({
      started_at: nowIso(),
      prev_session_id: prev,
      app_version: C.APP_VERSION,
      user_agent: navigator.userAgent,
      screen: window.screen ? (window.screen.width + "x" + window.screen.height) : "",
      timezone: (Intl && Intl.DateTimeFormat) ? Intl.DateTimeFormat().resolvedOptions().timeZone : ""
    }, sessionSnapshot("started")));
  }

  function tick() {
    if (!session) return;
    const visible = document.visibilityState === "visible";
    const idle = (Date.now() - lastActivity) / 1000;
    if (visible && idle <= C.IDLE_LIMIT_S) { activeS++; pageActiveS++; }
  }
  function heartbeat() {
    if (!session) return;
    if (activeS !== lastHeartbeatActive) { lastHeartbeatActive = activeS; emitSessionUpdate("heartbeat"); }
    if (queue.length) scheduleFlush(0);
  }

  // Tab hidden / closed / navigated away: write what we know, and try to deliver it even while the page is closing.
  function onLeaving(reason) {
    if (!session) return;
    const t = Date.now();
    if (t - lastUnloadFlush < 1500 && reason !== "hidden") return;   // pagehide + beforeunload fire together
    lastUnloadFlush = t;
    emitPageSegment(reason);
    emitSessionUpdate(reason);
    beaconFlush();
  }

  // ---------------- transport ----------------
  function fetchWithTimeout(url, opts, ms) {
    const ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    const timer = setTimeout(() => { if (ctl) ctl.abort(); }, ms);
    return fetch(url, Object.assign({}, opts, ctl ? { signal: ctl.signal } : {})).finally(() => clearTimeout(timer));
  }
  function configured() { return C.SCRIPT_URL && C.SCRIPT_URL.indexOf("PASTE_YOUR") === -1; }

  function scheduleFlush(delay) {
    if (C.DRY_RUN || captured) return;
    clearTimeout(flushTimer);
    flushTimer = setTimeout(flush, delay);
  }

  async function postJson(payload) {
    const res = await fetchWithTimeout(C.SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },   // "simple" request: no CORS preflight (Apps Script cannot answer one)
      body: JSON.stringify(payload)
    }, 20000);
    const text = await res.text();
    let json;
    try { json = JSON.parse(text); }
    catch (e) { throw new Error("Endpoint did not return JSON (wrong URL, expired deployment, or a Google authorisation page)"); }
    return json;
  }

  async function flush() {
    if (C.DRY_RUN || captured) return;
    if (flushing) return;
    if (!queue.length) return;
    if (!configured()) { setConnected(false, "SCRIPT_URL is not set"); return; }
    flushing = true;
    try {
      while (queue.length) {
        const batch = queue.slice(0, C.BATCH_SIZE);
        let ok = false, lastErr = "";
        for (let attempt = 0; attempt <= C.RETRY_BACKOFF_MS.length; attempt++) {
          try {
            const json = await postJson({ action: "log", events: batch, client: { user_agent: navigator.userAgent, app_version: C.APP_VERSION } });
            if (json && json.ok) { ok = true; break; }
            lastErr = (json && json.error) || "server refused the batch";
          } catch (e) { lastErr = e && e.message ? e.message : String(e); }
          if (attempt < C.RETRY_BACKOFF_MS.length) await sleep(C.RETRY_BACKOFF_MS[attempt] + Math.random() * 500);
        }
        if (!ok) {
          setConnected(false, lastErr);
          retryDelay = Math.min(retryDelay * 2, 120000);
          clearTimeout(retryTimer);
          retryTimer = setTimeout(flush, retryDelay);
          return;                                    // events stay in the queue (and in localStorage)
        }
        const sent = new Set(batch.map(e => e.event_id));
        queue = queue.filter(e => !sent.has(e.event_id));
        saveQueue();
        retryDelay = 15000;
        setConnected(true, "");
      }
    } finally { flushing = false; updateBadge(); }
  }

  // Best-effort delivery while the page is closing. The queue is NOT cleared here: the server ignores duplicate event_ids,
  // so anything the beacon missed is simply re-sent on the next successful flush.
  function beaconFlush() {
    if (C.DRY_RUN || captured || !configured() || !queue.length) return;
    try {
      const body = JSON.stringify({ action: "log", events: queue.slice(-200), client: { user_agent: navigator.userAgent, app_version: C.APP_VERSION } });
      if (navigator.sendBeacon) navigator.sendBeacon(C.SCRIPT_URL, new Blob([body], { type: "text/plain;charset=UTF-8" }));
    } catch (e) { /* the localStorage queue is the fallback */ }
  }

  // ---------------- health check + status display ----------------
  async function healthCheck() {
    setHealthText("checking", "Checking analytics connection…");
    if (C.DRY_RUN) { setHealthText("warn", "Analytics: dry-run mode (nothing is sent)."); return false; }
    if (!configured()) { setConnected(false, "SCRIPT_URL has not been set in the code"); return false; }
    try {
      const res = await fetchWithTimeout(C.SCRIPT_URL + (C.SCRIPT_URL.indexOf("?") === -1 ? "?" : "&") + "action=ping&client_ts=" + encodeURIComponent(nowIso()) + "&t=" + Date.now(), {}, 12000);
      const text = await res.text();
      let json;
      try { json = JSON.parse(text); } catch (e) { throw new Error("Endpoint did not return JSON (wrong URL, expired deployment, or Google authorisation needed)"); }
      if (!json.ok || !json.sheet_ok) throw new Error(json.error || "Endpoint reached but the Sheet could not be written");
      setConnected(true, "", json.version);
      if (queue.length) scheduleFlush(0);       // send anything saved from an earlier failure
      return true;
    } catch (e) {
      setConnected(false, e && e.message ? e.message : String(e));
      return false;
    }
  }

  function setConnected(ok, err, version) {
    connected = ok; lastError = err || "";
    if (ok) setHealthText("ok", "Analytics connected ✓" + (version ? "  (" + version + ")" : "") + (queue.length ? "  · sending " + queue.length + " saved event(s)" : ""));
    else setHealthText("bad", "Analytics NOT connected ✗ — " + (err || "unknown problem") + ". Answers are being kept on this computer and will be sent when the connection returns. Tell your instructor.");
    updateBadge();
  }
  function setHealthText(state, text) {
    const el = document.getElementById("analytics-health");
    if (!el) return;
    el.className = "ah-" + state;
    el.textContent = text;
    if (state === "bad" || state === "ok") {
      const a = document.createElement("a");
      a.href = "#"; a.textContent = "  Re-check"; a.className = "ah-recheck";
      a.addEventListener("click", (e) => { e.preventDefault(); healthCheck(); });
      el.appendChild(a);
    }
  }
  function updateBadge() {
    const el = document.getElementById("analytics-badge");
    if (!el) return;
    if (!session) { el.style.display = "none"; return; }
    el.style.display = "block";
    if (connected === false) { el.className = "bad"; el.textContent = "Analytics ✗ (" + queue.length + " saved)"; }
    else if (connected === true && queue.length === 0) { el.className = "ok"; el.textContent = "Analytics ✓"; }
    else { el.className = "pending"; el.textContent = "Analytics … (" + queue.length + ")"; }
  }

  // ---------------- wiring ----------------
  function markActivity() { lastActivity = Date.now(); }
  ["click", "keydown", "mousemove", "scroll", "wheel", "touchstart"].forEach(ev =>
    window.addEventListener(ev, markActivity, { passive: true, capture: true }));

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") onLeaving("hidden");
    else { lastActivity = Date.now(); pageEnter = Date.now(); if (queue.length) scheduleFlush(0); }
  });
  window.addEventListener("pagehide", () => onLeaving("unload"));
  window.addEventListener("beforeunload", () => onLeaving("unload"));
  window.addEventListener("online", () => { if (queue.length) scheduleFlush(0); healthCheck(); });
  setInterval(tick, 1000);
  setInterval(heartbeat, C.HEARTBEAT_MS);

  return {
    healthCheck, startSession, onRender, onLinkClick, flush,
    isQuestionPassage, outcomeOfTarget, nameSaysCorrect,
    isConnected: () => connected,
    queueLength: () => queue.length,
    // self-test hooks
    _capture(arr) { captured = arr; },
    _session: () => session,
    _end() { session = null; captured = null; }
  };
})();

// ---------------------------------------------------------------------------
// Self-test: walks EVERY check-question and EVERY option through the real page (real link clicks) and confirms the
// logged "correct" field matches what the student is shown. Nothing is sent. Open the page with ?selftest=1
// ---------------------------------------------------------------------------
function runAnalyticsSelfTest() {
  const events = [];
  const failures = [];
  let questions = 0, options = 0, embedded = 0, mcq = 0;
  Analytics._capture(events);
  Analytics.startSession("00000_TEST");
  const qKeys = Object.keys(PASSAGES).filter(k => Analytics.isQuestionPassage(k));
  qKeys.forEach(q => {
    const opts = [...PASSAGES[q].matchAll(/\[\[([A-D]\) [^\]|]*)\|([^\]]+)\]\]/g)].map(m => ({ label: m[1].trim(), target: m[2].trim() }));
    const isMcq = /^Retrieval-Q\d+$/.test(q);
    questions++; if (isMcq) mcq++; else embedded++;
    let nCorrect = 0;
    opts.forEach(o => {
      renderPassage(q);
      const before = events.length;
      const link = [...document.querySelectorAll("#passage-container a[data-target]")].find(a => a.textContent.trim() === o.label);
      if (!link) { failures.push(q + ": option link not found: " + o.label); return; }
      link.click();
      options++;
      const ev = events.slice(before).find(e => e.type === "answer" || e.type === "mcq_result");
      const shownCorrect = !!document.querySelector("#passage-container .feedback-correct");
      const shownWrong = !!document.querySelector("#passage-container .feedback-incorrect");
      if (!ev) { failures.push(q + " / " + o.label + ": no answer event logged"); return; }
      if (shownCorrect === shownWrong) failures.push(q + " / " + o.label + ": destination page is neither clearly correct nor incorrect");
      if (ev.correct !== shownCorrect) failures.push(q + " / " + o.label + ": logged correct=" + ev.correct + " but page shows " + (shownCorrect ? "CORRECT" : "INCORRECT"));
      if (ev.signals_agree !== true) failures.push(q + " / " + o.label + ": passage NAME (" + ev.destination_passage + ") disagrees with the logged correct flag");
      if (ev.destination_passage !== o.target) failures.push(q + " / " + o.label + ": destination logged as " + ev.destination_passage + ", expected " + o.target);
      if (ev.question_id !== q) failures.push(q + " / " + o.label + ": question_id logged as " + ev.question_id);
      if (isMcq && ev.type !== "mcq_result") failures.push(q + ": MCQ answer not logged as mcq_result");
      if (!isMcq && ev.type !== "answer") failures.push(q + ": embedded answer not logged as answer");
      if (shownCorrect) nCorrect++;
    });
    if (nCorrect !== 1) failures.push(q + ": has " + nCorrect + " correct options (expected exactly 1)");
  });
  // code-handling checks
  const codeChecks = [["02210", "student", false], ["12345", "test", true], ["22176_EDUCATOR", "instructor", true], ["99999", "test", true]];
  codeChecks.forEach(([code, type, isTest]) => {
    const evs = []; Analytics._capture(evs); Analytics.startSession(code);
    const s = evs.find(e => e.type === "session_start");
    if (!s || s.student_code !== code || typeof s.student_code !== "string") failures.push("code " + code + " not preserved as text (got " + (s && s.student_code) + ")");
    if (!s || s.session_type !== type || s.is_test !== isTest) failures.push("code " + code + " classified as " + (s && s.session_type) + "/" + (s && s.is_test) + ", expected " + type + "/" + isTest);
  });
  Analytics._end();
  const result = { questions, embedded, mcq, options, failures, passed: failures.length === 0 };
  window.__selfTestResult = result;
  const panel = document.createElement("div");
  panel.id = "selftest-panel";
  panel.textContent = (result.passed ? "SELF-TEST PASSED ✓" : "SELF-TEST FAILED ✗") +
    "\n\nQuestions checked: " + questions + " (" + embedded + " embedded + " + mcq + " MCQ)\nOptions clicked: " + options +
    "\nFailures: " + failures.length + (failures.length ? "\n\n" + failures.join("\n") : "") +
    "\n\n(Nothing was sent to the server. Reload without ?selftest=1 to use the activity.)";
  document.body.appendChild(panel);
  console.log("Analytics self-test", result);
  return result;
}

// Navigation history, used by the Back button
let passageHistory = [];
let currentPassageKey = null;
let nextNavType = "link";        // reported to analytics: start | link | back

function navigateTo(target) {
  if (target === 'Start-Complement') {
    passageHistory = [];                                   // main menu starts a fresh trail
  } else if (passageHistory.lastIndexOf(target) !== -1) {
    passageHistory = passageHistory.slice(0, passageHistory.lastIndexOf(target));   // e.g. "Try again" returns to a page already visited
  } else if (currentPassageKey && currentPassageKey !== target) {
    passageHistory.push(currentPassageKey);
  }
  nextNavType = "link";
  renderPassage(target);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goBack() {
  const previous = passageHistory.pop();
  if (previous) {
    nextNavType = "back";
    renderPassage(previous);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function renderPassage(passageKey) {
  const container = document.getElementById('passage-container');
  if (!container) return;
  const rawContent = PASSAGES[passageKey];
  if (!rawContent) {
    container.innerHTML = `<div class="passage"><h2>Error</h2><p>Passage <code>${passageKey}</code> not found.</p><a class="link-internal link-continue" href="#" data-target="Start-Complement">Return to Main Menu</a></div>`;
  } else {
    const isClinical = /section-label clinical/.test(rawContent);
    container.innerHTML = `<div class="passage${isClinical ? ' clinical-passage' : ''}">${parseLinks(rawContent)}</div>`;
  }
  
  currentPassageKey = passageKey;
  Analytics.onRender(passageKey, nextNavType);
  nextNavType = "link";

  // Back button (above the "Return to Main Menu" link), shown when there is a previous page, except on wrong-answer pages
  const passageEl = container.querySelector('.passage');
  const isWrongAnswer = rawContent && rawContent.includes('feedback-incorrect');   // wrong-answer pages only offer 'Try again'
  if (passageEl && passageHistory.length > 0 && !isWrongAnswer) {
    const back = document.createElement('a');
    back.className = 'link-internal link-back';
    back.href = '#';
    back.id = 'back-btn';
    back.textContent = '← Back';
    back.addEventListener('click', (e) => { e.preventDefault(); goBack(); });
    const exit = passageEl.querySelector('.menu-exit-container');
    if (exit) passageEl.insertBefore(back, exit); else passageEl.appendChild(back);
  }

  const links = container.querySelectorAll('a[data-target], [data-target]');
  links.forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      const target = link.getAttribute('data-target');
      if (target) {
        Analytics.onLinkClick(currentPassageKey, target, link.textContent);   // logged before navigating, from the same target that is about to be shown
        navigateTo(target);
      }
    });
  });
}

document.addEventListener('DOMContentLoaded', () => {
  const sidInput = document.getElementById('sid-input');
  const sidBtn = document.getElementById('sid-btn');
  const sidModal = document.getElementById('student-modal');
  const sidErr = document.getElementById('sid-errtxt');

  function startApp() {
    let val = sidInput ? String(sidInput.value).trim() : '';          // always a string: leading zeros (e.g. 02210) must survive
    val = val.replace(/_(educator|test)$/i, m => m.toUpperCase());
    if (/^\d{5}(_(EDUCATOR|TEST))?$/.test(val)) {
      if (sidModal) sidModal.style.display = 'none';
      passageHistory = [];
      Analytics.startSession(val);
      nextNavType = 'start';
      renderPassage('Start-Complement');
    } else {
      if (sidInput) sidInput.classList.add('sid-error');
      if (sidErr) sidErr.innerText = 'Please enter a valid 5-digit lab code.';
      setTimeout(() => {
        if (sidInput) sidInput.classList.remove('sid-error');
      }, 500);
    }
  }

  if (/[?&]selftest=1/.test(location.search)) {          // instructor self-test: no gate, nothing is sent
    if (sidModal) sidModal.style.display = 'none';
    runAnalyticsSelfTest();
    return;
  }
  Analytics.healthCheck();                                 // shown on this screen: instructor confirms before every session

  if (sidBtn) sidBtn.onclick = startApp;
  if (sidInput) {
    sidInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        startApp();
      }
    });
  }
});
</script>
