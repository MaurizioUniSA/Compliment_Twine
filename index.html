<title>The Complement System — Interactive Pathway Learning Activity</title>
<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {

}

    color: #1a1a2e;
    margin-bottom: 1rem;
    line-height: 1.25;
}
h2 {
    font-size: 1.2rem;
    font-weight: 600;

    margin-bottom: 0.85rem;
    padding-bottom: 0.4rem;
    border-bottom: 2px solid #eaecf8;
}
h3 {
    font-size: 1.05rem;
    font-weight: 600;

}

p {

}

/* ── Diagrams ────────────────────────────────────────── */
.diagram-container {
    margin: 1.25rem 0;
    text-align: center;
}
.diagram-img {
    max-width: 100%;
    height: auto;
    border-radius: 10px;

    border: 1px solid #d4daf7;
    background: #ffffff;
    display: block;
    margin: 0 auto;
}

a.link-internal {
    display: block;
    background: #f0f3ff;
    border: 1.5px solid #c8d1fa;
    border-radius: 99px;
    padding: 0.65rem 1.1rem;
    margin: 0.45rem 0;
    color: #1e2d7a;
    font-weight: 500;
    text-decoration: none;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    cursor: pointer;
}
a.link-internal:hover {
    background: #dce3ff;
    border-color: #7c8fee;
    transform: translateX(3px);
    text-decoration: none;
    color: #111e6e;
}
a.link-internal:active {
    background: #c7d0f9;
    transform: translateX(1px);
}

.feedback-correct {
    background: #f0fbf4;
    border-left: 4px solid #27a85f;
    border-radius: 0 9px 9px 0;

    margin: 0.5rem 0 1rem;

}
.feedback-incorrect {

}

.key-box {
    background: #fafbff;

    font-size: 0.95rem;
    line-height: 1.65;
}

.progress-label {
    font-size: 0.78rem;

.section-label.alternative { background: #e6fff0; color: #0a5c35; }
.section-label.lectin      { background: #fff8e6; color: #7a4800; }
.section-label.shared      { background: #f5e6ff; color: #5b0a8a; }

    background: rgba(20,30,80,0.82);

.notice-box {

    .section-label.alternative { background: #0a1e14; color: #60c890; }

    .clinical-table th         { background: #1a1c30; color: #9aadff; }

<div id="student-modal">
  <div class="modal-card">
    <h2>Complement System Activity</h2>
    <p>Enter your <strong>5-digit PC lab code</strong> to begin.<br>Your code is provided by your instructor.</p>
    <input type="text" id="sid-input" maxlength="5" inputmode="numeric" placeholder="· · · · ·" autocomplete="off">

    <button id="sid-btn">Begin Activity →</button>
  </div>

  <div id="passage-container"></div>
</div>
<script>
const PASSAGES = {
"Start-Complement": "<h1>The Complement System</h1>\n<p>The complement system is a crucial arm of innate immunity. In this activity you will explore how each pathway is activated, how the enzymatic cascade amplifies, and where the pathways converge.</p>\n\n<div class=\"diagram-container\"><img src=\"C'_Images/Slide1.PNG\" alt=\"Overview of the Complement System Pathways\" class=\"diagram-img\"></div>\n\n<div class=\"key-box\">\n<strong>Core Pathways and Modules:</strong><br>\n1. The Classical Pathway<br>\n2. The Alternative Pathway<br>\n3. The Lectin Pathway<br>\n4. Regulatory Control of Complement\n</div>\n\n<p>Each module features step-by-step decision questions with instant feedback. You can work through the pathways and clinical case studies in any order.</p>\n\n<div class=\"warning-box\">\n<strong>💡 How to get the most from this activity:</strong> When you encounter an option you are unsure about, deliberate carefully. Incorrect options provide detailed explanations of <em>why</em> they are incorrect, reinforcing your conceptual grasp.\n</div>\n\n<p><em>Where would you like to start?</em></p>\n\n[[Explore the Classical Pathway|Classical-Intro]]\n[[Explore the Alternative Pathway|Alternative-Intro]]\n[[Explore the Lectin Pathway|Lectin-Intro]]\n\n<hr style=\"border:none;margin:1rem 0;\">\n\n[[Explore Regulatory Control of Complement|Regulation_Intro]]\n[[Review: Clinical Case Studies & Complement Deficiencies|Clinical-Notes-Menu]]\n\n<hr style=\"border:none;margin:1rem 0;\">\n<a class=\"link-internal mcq-link\" href=\"#\" data-target=\"Retrieval-Intro\">📝 MCQ Self-Test — Retrieval Practice (10 questions)</a>",

"Clinical-Notes-Menu": "<div class=\"section-label clinical\">Clinical Medicine</div>\n<h1>Complement Deficiencies &amp; Diagnostic Profiles</h1>\n<p>The <strong>CH50 (total classical haemolytic complement) assay</strong> measures the functional capacity of serum to lyse antibody-sensitised sheep erythrocytes (requiring intact C1 through C9). In contrast, the <strong>AP50 assay</strong> evaluates the alternative pathway. Deficiencies at specific points produce distinctive clinical presentations and diagnostic patterns.</p>\n<div class=\"notice-box\">\n<strong>⚠️ Immune Complex Clearance Reminder:</strong> C3b and C4b covalently coat immune complexes. Complement receptor 1 (CR1, CD35) on erythrocytes binds these complexes and transports them to splenic and hepatic macrophages for clearance. Failure of this mechanism (e.g. C1q, C4, or C2 deficiency) allows immune complexes to deposit in microvasculature, driving a severe SLE-like phenotype.\n</div>\n\n<p><em>Select a clinical case file to review:</em></p>\n\n[[Case 1: C1q Deficiency (9yo F — Recurrent Infections & Lupus-like Rash)|Clinical-Case-1]]\n[[Case 2: C2 Deficiency (34yo M — Recurrent Sinopulmonary Infections & SLE)|Clinical-Case-2]]\n[[Case 3: C3 Deficiency (3yo M — Severe Phenotype / Multi-Pathway Failure)|Clinical-Case-3]]\n[[Case 4: C4A/C4B Null Allele Deficiency (22yo F — Treatment-Refractory SLE)|Clinical-Case-4]]\n[[Case 5: C5 Deficiency (19yo M — Recurrent Neisseria Meningitidis)|Clinical-Case-5]]\n[[📊 Review CH50 vs AP50 Diagnostic Summary Table|Clinical-Diagnostic-Summary]]\n\n<br>\n[[← Return to Main Menu|Start-Complement]]",

"Clinical-Case-1": "<div class=\"section-label clinical\">Clinical Case Study</div>\n<h2>Case 1: C1q Deficiency [Rare autosomal recessive]</h2>\n<p><strong>Patient Profile:</strong> Female, 9 years old — recurrent infections &amp; lupus-like rash.</p>\n\n<h3>Pathway Blockade Site</h3>\n<p><strong>C1q [BLOCKED]</strong> → C1r/C1s → C4 → C2 → C3 → MAC (C5–C9)</p>\n\n<h3>Clinical Presentation</h3>\n<p>A 9-year-old girl is referred to paediatric immunology with a 3-year history of a photosensitive malar rash, recurrent otitis media, and two prior episodes of pneumococcal bacteraemia. She has mild arthralgia affecting the small joints of her hands. Her mother reports that a maternal uncle died in childhood from overwhelming infection. On examination she has a butterfly-shaped erythematous rash over both cheeks sparing the nasolabial folds, and mild cervical lymphadenopathy.</p>\n\n<h3>Laboratory Findings</h3>\n<div class=\"table-scroll\">\n<table class=\"clinical-table\">\n  <tr><th>Test</th><th>Result</th><th>Reference / Note</th></tr>\n  <tr><td>CH50 (classical haemolytic)</td><td><strong>0 U/mL</strong></td><td>Ref: 41–90 U/mL — absent classical activity</td></tr>\n  <tr><td>AP50 (alternative haemolytic)</td><td><strong>68 U/mL</strong></td><td>Ref: >60 U/mL — alternative pathway intact</td></tr>\n  <tr><td>C1q antigen level</td><td><strong>&lt;1 mg/dL</strong></td><td>Ref: 14–22 mg/dL — undetectable</td></tr>\n  <tr><td>C4 level</td><td><strong>Normal (24 mg/dL)</strong></td><td>Ref: 16–38 mg/dL — no downstream consumption</td></tr>\n  <tr><td>C3 level</td><td><strong>Normal (122 mg/dL)</strong></td><td>Ref: 90–180 mg/dL</td></tr>\n  <tr><td>ANA / anti-dsDNA</td><td><strong>Positive (1:320)</strong></td><td>Autoimmune SLE-like serology</td></tr>\n</table>\n</div>\n\n<h3>Pathophysiology</h3>\n<p>C1q is the hexameric recognition unit of the classical C1 complex. Complete absence of C1q abolishes classical pathway initiation, yielding an absent (0 U/mL) CH50 while AP50 remains normal. Beyond host defence, C1q plays an indispensable physiologic role as a bridging molecule in clearing apoptotic debris: it binds surface-exposed <strong>phosphatidylserine</strong>, <strong>DNA</strong>, and <strong>calreticulin</strong> on dying cells, facilitating non-inflammatory uptake by macrophages. In C1q deficiency, apoptotic debris accumulates and presents nuclear neoantigens (dsDNA and histones) to autoreactive lymphocytes, driving anti-dsDNA production and clinical SLE in >90% of cases. Recurrent encapsulated infections stem from impaired classical-mediated opsonisation.</p>\n\n<h3>Management</h3>\n<p>Prophylactic penicillin V; comprehensive immunisation (PCV13/23, Hib, MenACWY, MenB). Hydroxychloroquine for lupus symptoms. Genetic counselling (autosomal recessive mutations in <em>C1QA</em>, <em>C1QB</em>, or <em>C1QC</em> on chromosome 1p36) and family cascade screening.</p>\n\n[[Return to Clinical Notes Menu|Clinical-Notes-Menu]]",

"Clinical-Case-2": "<div class=\"section-label clinical\">Clinical Case Study</div>\n<h2>Case 2: C2 Deficiency [Most common classical deficiency]</h2>\n<p><strong>Patient Profile:</strong> Male, 34 years old — recurrent sinopulmonary infections &amp; SLE diagnosis.</p>\n\n<h3>Pathway Blockade Site</h3>\n<p>C1q → C1r/C1s → C4 → <strong>C2 [BLOCKED]</strong> → C3 convertase (C4b2a) → MAC</p>\n\n<h3>Clinical Presentation</h3>\n<p>A 34-year-old male presents with his fourth episode of bacterial sinusitis in 18 months, twice requiring intravenous antibiotics. He was diagnosed with SLE at age 28 with arthritis, discoid rash, and pleuritis. His disease has shown atypical resistance to standard therapies. He has no prior history of meningococcal infection. Examination shows bilateral maxillary sinus tenderness and a left basal pleural friction rub.</p>\n\n<h3>Laboratory Findings</h3>\n<div class=\"table-scroll\">\n<table class=\"clinical-table\">\n  <tr><th>Test</th><th>Result</th><th>Reference / Note</th></tr>\n  <tr><td>CH50</td><td><strong>&lt;10 U/mL</strong></td><td>Ref: 41–90 U/mL — severely depressed</td></tr>\n  <tr><td>AP50</td><td><strong>72 U/mL</strong></td><td>Ref: >60 U/mL — normal alternative function</td></tr>\n  <tr><td>C2 antigen</td><td><strong>Undetectable</strong></td><td>Ref: 22–34 mg/dL — homozygous deficiency</td></tr>\n  <tr><td>C4 level</td><td><strong>Normal (28 mg/dL)</strong></td><td>Ref: 16–38 mg/dL — synthesis normal; downstream arrest prevents consumption</td></tr>\n  <tr><td>C3 level</td><td><strong>Normal (115 mg/dL)</strong></td><td>Ref: 90–180 mg/dL — alternative pathway preserves basal levels</td></tr>\n  <tr><td>MBL functional activity</td><td><strong>Severely reduced</strong></td><td>Lectin pathway also relies on C2</td></tr>\n</table>\n</div>\n\n<h3>Pathophysiology</h3>\n<p>C2 is cleaved by C1s (or MASP-2) while bound to surface C4b. In the absence of C2, the classical and lectin C3 convertase (<strong>C4b2a</strong>) cannot form. This arrests classical and lectin cascades immediately prior to C3 activation. Because C4 is cleaved upstream of C2, C4 synthesis is intact; furthermore, because no functional C3 convertase forms to initiate active downstream amplification loops, serum C4 does not undergo high-turnover consumption at baseline and levels remain normal. Both CH50 and lectin-mediated lysis are severely impaired, whereas AP50 is completely preserved because the alternative pathway utilizes Factor B instead of C2. Approximately 10–30% of C2-deficient individuals develop an SLE-like illness due to subnormal clearance of circulating immune complexes.</p>\n\n<h3>Management</h3>\n<p>Infection prophylaxis (amoxicillin-clavulanate or azithromycin); pneumococcal, meningococcal, and Hib vaccinations. SLE management with hydroxychloroquine and low-dose corticosteroids. Genetic confirmation (chromosome 6p21.3, MHC class III region; HLA-A25, B18, DR2 haplotype association).</p>\n\n[[Return to Clinical Notes Menu|Clinical-Notes-Menu]]",

"Clinical-Case-3": "<div class=\"section-label clinical\">Clinical Case Study</div>\n<h2>Case 3: C3 Deficiency [Severe phenotype — all pathways affected]</h2>\n<p><strong>Patient Profile:</strong> Male, 3 years old — recurrent severe pyogenic bacterial infections.</p>\n\n<h3>Pathway Blockade Site</h3>\n<p>Classical / Lectin / Alternative → <strong>C3 [BLOCKED]</strong> → C3b opsonisation / C5 convertase → MAC</p>\n\n<h3>Clinical Presentation</h3>\n<p>A 3-year-old boy is admitted with his fifth episode of bacterial meningitis (confirmed <em>Streptococcus pneumoniae</em>). Since infancy, he has had recurrent lobar pneumonias, otitis media, and two prior bouts of pneumococcal septicaemia. Growth is on the 3rd percentile. He is the child of first-cousin consanguineous parents. A sibling died at 18 months of fulminant sepsis. On examination he is febrile (39.5°C), irritable, and has marked nuchal rigidity.</p>\n\n<h3>Laboratory Findings</h3>\n<div class=\"table-scroll\">\n<table class=\"clinical-table\">\n  <tr><th>Test</th><th>Result</th><th>Reference / Note</th></tr>\n  <tr><td>CH50</td><td><strong>0 U/mL</strong></td><td>Ref: 41–90 U/mL — completely absent</td></tr>\n  <tr><td>AP50</td><td><strong>0 U/mL</strong></td><td>Ref: >60 U/mL — completely absent</td></tr>\n  <tr><td>C3 antigen level</td><td><strong>&lt;1 mg/dL</strong></td><td>Ref: 90–180 mg/dL — undetectable</td></tr>\n  <tr><td>C4 level</td><td><strong>Normal (30 mg/dL)</strong></td><td>Ref: 16–38 mg/dL — upstream classical arm intact</td></tr>\n  <tr><td>C1q level</td><td><strong>Normal (18 mg/dL)</strong></td><td>Ref: 14–22 mg/dL</td></tr>\n  <tr><td>Opsonophagocytosis assay</td><td><strong>Severely defective</strong></td><td>Failure of C3b/iC3b coating</td></tr>\n</table>\n</div>\n\n<h3>Pathophysiology</h3>\n<p>C3 is the shared central hub where all three complement cascades converge. Primary absence of C3 abolishes the generation of <strong>C3b</strong> (the predominant opsonin recognised by phagocytic CR1/CD35 and CR3/CD11b), <strong>C3a</strong> (anaphylatoxin), and the downstream assembly of both classical (C4b2a3b) and alternative (C3bBb3bP) C5 convertases. Consequently, both CH50 and AP50 are completely absent (0 U/mL). Encapsulated bacteria (<em>S. pneumoniae</em>, <em>H. influenzae</em>, <em>N. meningitidis</em>) cannot be cleared efficiently by neutrophils or splenic macrophages without C3b coating, resulting in profound susceptibility to severe invasive pyogenic infections from early infancy.</p>\n\n<h3>Management</h3>\n<p>Immediate parenteral third-generation cephalosporins for active meningitis. Long-term continuous oral penicillin prophylaxis, aggressive conjugate and polysaccharide vaccination schedules, prompt empiric therapy for febrile illness, and genetic analysis of the <em>C3</em> gene (chromosome 19p13.3).</p>\n\n[[Return to Clinical Notes Menu|Clinical-Notes-Menu]]",

"Clinical-Case-4": "<div class=\"section-label clinical\">Clinical Case Study</div>\n<h2>Case 4: C4A/C4B Null Allele Deficiency [SLE susceptibility locus]</h2>\n<p><strong>Patient Profile:</strong> Female, 22 years old — early-onset treatment-refractory SLE.</p>\n\n<h3>Pathway Blockade Site</h3>\n<p>C1q → C1r/C1s → <strong>C4 [PARTIAL BLOCK]</strong> → C4b2a convertase → C3 → MAC</p>\n\n<h3>Clinical Presentation</h3>\n<p>A 22-year-old female presents with severe fatigue, a photosensitive butterfly rash, painless palatal ulcers, pleuritic chest pain, and non-scarring alopecia. Urinalysis reveals 3+ proteinuria and active urine sediment with microscopic haematuria and red blood cell casts. Family history is significant for autoimmune disease in maternal relatives.</p>\n\n<h3>Laboratory Findings</h3>\n<div class=\"table-scroll\">\n<table class=\"clinical-table\">\n  <tr><th>Test</th><th>Result</th><th>Reference / Note</th></tr>\n  <tr><td>CH50</td><td><strong>18 U/mL</strong></td><td>Ref: 41–90 U/mL — partially reduced</td></tr>\n  <tr><td>AP50</td><td><strong>66 U/mL</strong></td><td>Ref: >60 U/mL — alternative pathway intact</td></tr>\n  <tr><td>C4 total antigen</td><td><strong>4 mg/dL</strong></td><td>Ref: 16–38 mg/dL — profoundly depressed</td></tr>\n  <tr><td>C4A isotype</td><td><strong>Undetectable</strong></td><td>Homozygous C4A null gene deletion confirmed</td></tr>\n  <tr><td>C4B isotype</td><td><strong>Present (1 functional copy)</strong></td><td>Provides limited baseline C4 activity</td></tr>\n  <tr><td>C3 level</td><td><strong>Low (54 mg/dL)</strong></td><td>Ref: 90–180 mg/dL — consumed by active immune complexes</td></tr>\n</table>\n</div>\n\n<h3>Pathophysiology</h3>\n<p>C4 is encoded by two tandem genes in the MHC class III locus: <em>C4A</em> and <em>C4B</em>. C4A binds preferentially to amino groups on proteins and immune complexes, whereas C4B binds more efficiently to hydroxyl groups on carbohydrate surfaces. Complete deficiency of C4A impairs the covalent tagging and solubilisation of immune complexes. Without C4A-mediated opsonisation, immune complexes fail to bind erythrocyte CR1, accumulating and precipitating in renal glomeruli, joints, and microvessels. Because one copy of C4B remains, baseline classical pathway activity is maintained at a reduced level (CH50 ~18 U/mL) rather than 0 U/mL. During active flares, immune complex deposition accelerates consumption of remaining C4 and C3, lowering both further.</p>\n\n<h3>Management</h3>\n<p>Renal biopsy to stage lupus nephritis. Immunosuppressive therapy with corticosteroids and mycophenolate mofetil or cyclophosphamide, alongside hydroxychloroquine. Strict photoprotection and monitoring of anti-dsDNA and complement levels.</p>\n\n[[Return to Clinical Notes Menu|Clinical-Notes-Menu]]",

"Clinical-Case-5": "<div class=\"section-label clinical\">Clinical Case Study</div>\n<h2>Case 5: C5 Deficiency [Terminal complement / MAC deficiency]</h2>\n<p><strong>Patient Profile:</strong> Male, 19 years old — recurrent <em>Neisseria meningitidis</em> infections.</p>\n\n<h3>Pathway Blockade Site</h3>\n<p>C1–C4–C2 / C3 tick-over → C3 → <strong>C5 [BLOCKED]</strong> → C6 → C7 → C8 → C9 (MAC)</p>\n\n<h3>Clinical Presentation</h3>\n<p>A 19-year-old male university student is admitted with his second episode of culture-positive meningococcal meningitis in three years (serogroup B at age 16; serogroup Y currently). He had received routine conjugate MenACWY vaccination. On admission he is febrile (40.1°C), photophobic, irritable, and exhibits a petechial purpuric rash across his lower extremities with pronounced nuchal rigidity. A paternal uncle died of meningococcal septicaemia at age 22.</p>\n\n<h3>Laboratory Findings</h3>\n<div class=\"table-scroll\">\n<table class=\"clinical-table\">\n  <tr><th>Test</th><th>Result</th><th>Reference / Note</th></tr>\n  <tr><td>CH50</td><td><strong>0 U/mL</strong></td><td>Ref: 41–90 U/mL — absent terminal classical lysis</td></tr>\n  <tr><td>AP50</td><td><strong>0 U/mL</strong></td><td>Ref: >60 U/mL — absent terminal alternative lysis</td></tr>\n  <tr><td>C3 level</td><td><strong>Normal (125 mg/dL)</strong></td><td>Ref: 90–180 mg/dL — upstream hub entirely intact</td></tr>\n  <tr><td>C4 level</td><td><strong>Normal (26 mg/dL)</strong></td><td>Ref: 16–38 mg/dL — upstream classical arm intact</td></tr>\n  <tr><td>C5 antigen</td><td><strong>Undetectable (&lt;1 mg/dL)</strong></td><td>Ref: 8–15 mg/dL — isolated C5 deficiency</td></tr>\n  <tr><td>C1q, C2, Factor B</td><td><strong>Normal</strong></td><td>All early/middle pathway components preserved</td></tr>\n</table>\n</div>\n\n<h3>Pathophysiology</h3>\n<p>C5 convertases cleave C5 into C5a and C5b. C5b coordinates sequential recruitment of C6, C7, C8, and multiple C9 monomers to form the lytic <strong>Membrane Attack Complex (MAC, C5b-9)</strong>. Deficiencies in any terminal component (C5 through C9) abolish target cell lysis via both classical and alternative pathways, resulting in zero activity on both CH50 and AP50 assays. <strong>Crucially, serum C3 and C4 levels remain entirely normal</strong>, distinguishing terminal MAC defects from C3 deficiency.</p>\n<p>Terminal pathway-deficient patients show an extraordinarily specific susceptibility to invasive <em>Neisseria</em> infections (up to 10,000-fold relative risk). <em>Neisseria meningitidis</em> produces a polysaccharide capsule that strongly impedes phagocytic ingestion; direct insertion of the MAC pore across its outer and inner membranes represents the primary non-redundant mechanism of host serum bactericidal killing. By contrast, Gram-positive pathogens are protected from MAC insertion by their thick peptidoglycan cell walls and rely on C3b-mediated opsonophagocytosis, which remains completely functional.</p>\n\n<h3>Management</h3>\n<p>Acute management with high-dose IV ceftriaxone. Long-term management requires continuous chemoprophylaxis with oral penicillin V or erythromycin, alongside comprehensive meningococcal immunisation (both MenACWY and 4CMenB/MenB-FHbp vaccines). First-degree relatives should undergo CH50 screening.</p>\n<div class=\"notice-box\">\n<strong>Pharmacological Correlate:</strong> Therapeutic monoclonal antibodies directed against C5 (e.g. <strong>eculizumab</strong>, <strong>ravulizumab</strong>), used to treat paroxysmal nocturnal haemoglobinuria (PNH) and atypical haemolytic uraemic syndrome (aHUS), functionally reproduce congenital C5 deficiency. Consequently, all patients receiving C5 inhibitors carry an acute, lifelong risk of meningococcal disease and must receive mandatory prior vaccination and antibacterial prophylaxis.\n</div>\n\n[[Return to Clinical Notes Menu|Clinical-Notes-Menu]]",

"Clinical-Diagnostic-Summary": "<div class=\"section-label clinical\">Diagnostic Summary</div>\n<h2>Comparative CH50 vs AP50 Diagnostic Analysis</h2>\n<p>Comparative pattern analysis of the classical pathway (CH50) and alternative pathway (AP50) assays allows rapid clinical localization of inherited or acquired complement defects before gene sequencing or individual component assays.</p>\n\n<div class=\"table-scroll\">\n<table class=\"clinical-table\">\n  <tr>\n    <th>Defect / Condition</th>\n    <th>CH50</th>\n    <th>AP50</th>\n    <th>C3 Level</th>\n    <th>Discriminating Clinical &amp; Laboratory Features</th>\n  </tr>\n  <tr>\n    <td><strong>C1q, C1r, C1s deficiency</strong></td>\n    <td><strong>Zero</strong></td>\n    <td>Normal</td>\n    <td>Normal</td>\n    <td>Isolated classical failure; high penetrance of severe early-onset SLE-like disease due to impaired apoptotic debris clearance.</td>\n  </tr>\n  <tr>\n    <td><strong>C2 deficiency</strong></td>\n    <td><strong>Near-zero</strong></td>\n    <td>Normal</td>\n    <td>Normal</td>\n    <td>Most common deficiency; C4 is normal (downstream block avoids consumption); lectin pathway also impaired; associated with HLA-B18/DR2.</td>\n  </tr>\n  <tr>\n    <td><strong>C4A null alleles</strong></td>\n    <td><strong>Reduced</strong></td>\n    <td>Normal</td>\n    <td>Normal/Low</td>\n    <td>CH50 low but not zero (C4B remains functional); poor immune complex solubilisation promotes lupus nephritis.</td>\n  </tr>\n  <tr>\n    <td><strong>C3 deficiency</strong></td>\n    <td><strong>Zero</strong></td>\n    <td><strong>Zero</strong></td>\n    <td><strong>Zero</strong></td>\n    <td>Central convergence defect; severe recurrent pyogenic infections from infancy; defective opsonophagocytosis.</td>\n  </tr>\n  <tr>\n    <td><strong>Factor B or D deficiency</strong></td>\n    <td>Normal</td>\n    <td><strong>Zero</strong></td>\n    <td>Normal</td>\n    <td>Isolated alternative pathway arrest; recurrent encapsulated bacterial infections with intact antibody-mediated lysis.</td>\n  </tr>\n  <tr>\n    <td><strong>Properdin (Factor P) deficiency</strong></td>\n    <td>Normal</td>\n    <td><strong>Low/Zero</strong></td>\n    <td>Normal</td>\n    <td><strong>X-linked recessive</strong> transmission; convertase instability; high susceptibility to fulminant meningococcal meningitis.</td>\n  </tr>\n  <tr>\n    <td><strong>Terminal MAC (C5–C9) deficiency</strong></td>\n    <td><strong>Zero</strong></td>\n    <td><strong>Zero</strong></td>\n    <td><strong>Normal</strong></td>\n    <td>Normal C3 and C4 separates terminal defects from C3 deficiency; extraordinarily selective risk of recurrent <em>Neisseria</em> infections.</td>\n  </tr>\n</table>\n</div>\n\n<br>\n[[Return to Clinical Notes Menu|Clinical-Notes-Menu]]",

"Classical-Intro": "<div class=\"section-label classical\">Classical Pathway</div>\n<div class=\"progress-label\">Classical Pathway · Step 1 of 4</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:20%\"></div></div>\n\n<h2>Antibody-Mediated Activation</h2>\n<p>The classical pathway is initiated when antibodies bind target antigens. The critical initiating recognition complex is <strong>C1</strong>, whose six globular heads (C1q) bind to the Fc portions of antigen-bound immunoglobulins.</p>\n\n<div class=\"diagram-container\"><img src=\"C'_Images/Slide2.PNG\" alt=\"C1 complex binding antibody-antigen complex\" class=\"diagram-img\"></div>\n\n<p><em>Which of the following is the MOST potent activator of the classical pathway on a single-molecule basis?</em></p>\n\n[[A) A single IgG1 molecule bound to antigen|Classical-Q1-Incorrect-IgG-Single]]\n[[B) Secretory IgA dimers at a mucosal border|Classical-Q1-Incorrect-IgA]]\n[[C) A single pentameric IgM molecule bound to antigen|Classical-Q1-Correct-IgM]]\n[[D) Clustered IgG4 molecules on a cell surface|Classical-Q1-Incorrect-IgG4]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Classical-Q1-Incorrect-IgG-Single": "<div class=\"section-label classical\">Classical Pathway</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> A single IgG monomer has only one Fc region and cannot activate C1q. C1q requires simultaneous multi-point engagement of at least two adjacent Fc domains to trigger autoactivation of C1r.\n</div>\n[[← Try again|Classical-Intro]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Classical-Q1-Incorrect-IgA": "<div class=\"section-label classical\">Classical Pathway</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> Secretory IgA functions at mucosal barriers by neutralisation and immune exclusion; it does not activate the classical pathway via C1q.\n</div>\n[[← Try again|Classical-Intro]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Classical-Q1-Incorrect-IgG4": "<div class=\"section-label classical\">Classical Pathway</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> While clustered IgG1 and IgG3 molecules can activate C1q, IgG4 possesses an Fc hinge region that is unable to bind C1q effectively, making it incapable of classical pathway activation.\n</div>\n[[← Try again|Classical-Intro]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Classical-Q1-Correct-IgM": "<div class=\"section-label classical\">Classical Pathway</div>\n<div class=\"feedback-correct\">\n<strong>Correct!</strong> A single antigen-bound pentameric IgM molecule is the most potent activator known. Upon binding antigen, planar IgM adopts a 'staple' conformation that exposes multiple Fc binding sites simultaneously, easily bridging adjacent C1q globular heads.\n</div>\n<div class=\"notice-box\"><strong>Key Principle:</strong> C1q requires multivalent engagement. A single IgM pentamer provides this directly, whereas IgG requires at least two or more separate molecules clustered in close proximity.</div>\n[[Continue → C1 Activation|Classical-C1-Activation]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Classical-C1-Activation": "<div class=\"section-label classical\">Classical Pathway</div>\n<div class=\"progress-label\">Classical Pathway · Step 2 of 4</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:40%\"></div></div>\n\n<h2>C1 Activation: The Initial Cascade</h2>\n<p>The native C1 macromolecular complex comprises three distinct subunits:</p>\n<div class=\"key-box\">\n<strong>C1q</strong> — pattern-recognition subunit (binds antibody Fc regions)<br>\n<strong>C1r</strong> — autoactivating serine protease dimer<br>\n<strong>C1s</strong> — catalytic serine protease dimer (cleaves C4 and C2)\n</div>\n\n<div class=\"diagram-container\"><img src=\"C'_Images/Slide2.5.PNG\" alt=\"C1 complex activation details\" class=\"diagram-img\"></div>\n\n<p><em>What is the primary function of C1q within this complex?</em></p>\n\n[[A) To recognise and bind antigen-antibody complexes|Classical-Q2-Correct-Recognition]]\n[[B) To enzymatically cleave native C4|Classical-Q2-Incorrect-C4Cleavage]]\n[[C) To cleave C2 into C2a and C2b|Classical-Q2-Incorrect-C2Cleavage]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Classical-Q2-Incorrect-C4Cleavage": "<div class=\"section-label classical\">Classical Pathway</div>\n<div class=\"feedback-incorrect\">\n<strong>Not quite.</strong> C1q possesses no enzymatic or catalytic activity. The serine protease responsible for cleaving C4 is activated C1s.\n</div>\n[[← Try again|Classical-C1-Activation]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Classical-Q2-Incorrect-C2Cleavage": "<div class=\"section-label classical\">Classical Pathway</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> C1q is strictly a structural pattern-recognition molecule; C1s cleaves both C4 and C2.\n</div>\n[[← Try again|Classical-C1-Activation]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Classical-Q2-Correct-Recognition": "<div class=\"section-label classical\">Classical Pathway</div>\n<div class=\"feedback-correct\">\n<strong>Correct!</strong> C1q serves exclusively as the recognition unit. Its binding to immune complexes induces a conformational change that triggers C1r autoactivation, which in turn cleaves and activates the protease C1s.\n</div>\n<div class=\"notice-box\"><strong>Remember:</strong> C1q = target recognition. C1r = activates C1s. C1s = the active protease that cleaves substrates C4 and C2.</div>\n[[Continue → C4 Cleavage|Classical-C4-Cleavage]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Classical-C4-Cleavage": "<div class=\"section-label classical\">Classical Pathway</div>\n<div class=\"progress-label\">Classical Pathway · Step 3 of 4</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:60%\"></div></div>\n\n<h2>Cleavage of C4: Surface Deposition</h2>\n<p>Activated C1s cleaves circulating C4 into two fragments:</p>\n<div class=\"key-box\">\n<strong>C4a</strong> — small soluble anaphylatoxin, diffuses into the microenvironment<br>\n<strong>C4b</strong> — large reactive fragment that anchors the upcoming convertase\n</div>\n\n<div class=\"diagram-container\"><img src=\"C'_Images/Slide3.PNG\" alt=\"Cleavage of C4 and surface covalent attachment\" class=\"diagram-img\"></div>\n\n<p><em>What unique biochemical property allows C4b to anchor to the microbial surface?</em></p>\n\n[[A) High-affinity binding to surface cholesterol molecules|Classical-Q3-Incorrect-Cholesterol]]\n[[B) Cleavage of C4 exposes a reactive internal thioester bond that forms covalent links|Classical-Q3-Correct-Thioester]]\n[[C) Passive electrostatic attraction to negative bacterial surface charges|Classical-Q3-Incorrect-Electrostatic]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Classical-Q3-Incorrect-Cholesterol": "<div class=\"section-label classical\">Classical Pathway</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> C4b does not target cholesterol. It forms covalent ester or amide bonds via a freshly exposed reactive thioester domain.\n</div>\n[[← Try again|Classical-C4-Cleavage]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Classical-Q3-Incorrect-Electrostatic": "<div class=\"section-label classical\">Classical Pathway</div>\n<div class=\"feedback-incorrect\">\n<strong>Not quite.</strong> Electrostatic charges are reversible and non-covalent; C4b anchors irreversibly via a high-energy covalent thioester bond.\n</div>\n[[← Try again|Classical-C4-Cleavage]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Classical-Q3-Correct-Thioester": "<div class=\"section-label classical\">Classical Pathway</div>\n<div class=\"feedback-correct\">\n<strong>Correct!</strong> Native C4 contains a hidden internal thioester bond. Cleavage by C1s exposes this bond, allowing nucleophilic attack by hydroxyl (-OH) or amine (-NH2) groups on the pathogen surface to create an irreversible covalent anchor.\n</div>\n<div class=\"notice-box\"><strong>Remember:</strong> Both C4b and C3b utilize reactive internal thioester bonds to covalently fasten to target membranes within microseconds of activation.</div>\n[[Continue → C2 Cleavage|Classical-C2-Cleavage]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Classical-C2-Cleavage": "<div class=\"section-label classical\">Classical Pathway</div>\n<div class=\"progress-label\">Classical Pathway · Step 4 of 4</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:80%\"></div></div>\n\n<h2>Cleavage of C2 and Assembly of the C3 Convertase</h2>\n<p>C2 binds in a magnesium-dependent manner to surface-anchored C4b. C1s then cleaves C2:</p>\n<div class=\"key-box\">\n<strong>C2a</strong> — large fragment containing the catalytic serine protease domain; remains bound to C4b<br>\n<strong>C2b</strong> — small fragment released into solution\n</div>\n<div class=\"warning-box\"><strong>⚠️ Traditional Nomenclature Exception:</strong> In complement nomenclature, the 'b' fragment is almost always the larger active fragment (e.g., C3b, C4b, C5b). <strong>C2 is the sole historical exception</strong> in standard clinical use: C2a is the larger catalytic fragment that joins the convertase.</div>\n<p>The resulting surface-bound complex <strong>C4b2a</strong> is the <strong>Classical Pathway C3 Convertase</strong>.</p>\n\n<div class=\"diagram-container\"><img src=\"C'_Images/Slide4.PNG\" alt=\"Assembly of the Classical C3 Convertase C4b2a\" class=\"diagram-img\"></div>\n\n<p><em>What is the composition of the Classical Pathway C3 Convertase?</em></p>\n\n[[A) C3bBb|Classical-Q4-Incorrect-Alternative]]\n[[B) C1qrs|Classical-Q4-Incorrect-C1Complex]]\n[[C) C4b2a|Classical-Q4-Correct-C4b2a]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Classical-Q4-Incorrect-Alternative": "<div class=\"section-label classical\">Classical Pathway</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> C3bBb is the C3 convertase of the Alternative pathway, generated by Factor B and Factor D.\n</div>\n[[← Try again|Classical-C2-Cleavage]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Classical-Q4-Incorrect-C1Complex": "<div class=\"section-label classical\">Classical Pathway</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> C1qrs is the soluble initiation complex responsible for cleaving C4 and C2; it is not the convertase that cleaves C3.\n</div>\n[[← Try again|Classical-C2-Cleavage]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Classical-Q4-Correct-C4b2a": "<div class=\"section-label classical\">Classical Pathway</div>\n<div class=\"feedback-correct\">\n<strong>Correct!</strong> C4b2a is the classical (and lectin) C3 convertase. Its catalytic subunit (C2a) efficiently cleaves hundreds of circulating C3 molecules, initiating exponential amplification.\n</div>\n[[Continue → C3 Cleavage (shared steps)|Shared-C3-Cleavage-From-Alternative]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Alternative-Intro": "<div class=\"section-label alternative\">Alternative Pathway</div>\n<div class=\"progress-label\">Alternative Pathway · Step 1 of 5</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:20%\"></div></div>\n\n<h2>Spontaneous Activation and Constant Surveillance</h2>\n<p>Unlike the classical and lectin pathways, the alternative pathway does <strong>not</strong> require antibodies or microbial lectin binding to initiate. Instead, it maintains a continuous state of low-level background activation.</p>\n\n<div class=\"diagram-container\"><img src=\"C'_Images/Slide5.PNG\" alt=\"Alternative pathway spontaneous C3 tick-over\" class=\"diagram-img\"></div>\n\n<p><em>Which biochemical event initiates this antibody-independent activation?</em></p>\n\n[[A) Spontaneous low-rate hydrolysis of C3 into C3(H2O)|Alternative-Q1-Correct-Tickover]]\n[[B) Cleavage of Factor B directly by circulating thrombin|Alternative-Q1-Incorrect-Thrombin]]\n[[C) Binding of Properdin directly to intact microbial cell membranes|Alternative-Q1-Incorrect-Properdin]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Alternative-Q1-Incorrect-Thrombin": "<div class=\"section-label alternative\">Alternative Pathway</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> Thrombin is a coagulation protease. Factor B is cleaved by the dedicated complement protease Factor D, and only after Factor B has bound to C3(H2O) or C3b.\n</div>\n[[← Try again|Alternative-Intro]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Alternative-Q1-Incorrect-Properdin": "<div class=\"section-label alternative\">Alternative Pathway</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> While properdin can bind certain microbial surfaces, it primarily acts downstream to stabilize pre-existing C3bBb convertase complexes.\n</div>\n[[← Try again|Alternative-Intro]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Alternative-Q1-Correct-Tickover": "<div class=\"section-label alternative\">Alternative Pathway</div>\n<div class=\"feedback-correct\">\n<strong>Correct!</strong> The process known as <strong>C3 tick-over</strong> involves continuous, slow nucleophilic attack of water on the internal thioester bond of native C3, generating C3(H2O) (or iC3) in the fluid phase.\n</div>\n<div class=\"notice-box\"><strong>Remember:</strong> C3 tick-over is continuous and spontaneous. The alternative pathway is always 'idling' in healthy plasma, ready to amplify the moment an unprotected surface appears.</div>\n[[Continue → C3(H2O) and Factor B|Alternative-C3H2O-FactorB]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Alternative-C3H2O-FactorB": "<div class=\"section-label alternative\">Alternative Pathway</div>\n<div class=\"progress-label\">Alternative Pathway · Step 2 of 5</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:40%\"></div></div>\n\n<h2>Assembly with Factor B and Factor D</h2>\n<p>Hydrolysed C3(H2O) changes conformation to reveal a high-affinity binding site for plasma <strong>Factor B</strong>. Once complexed in the presence of Mg<sup>2+</sup>, Factor B becomes vulnerable to cleavage by <strong>Factor D</strong>.</p>\n\n<p><em>What is the specific enzymatic action of Factor D?</em></p>\n\n[[A) It cleaves native C3 directly in plasma|Alternative-Q2-Incorrect-C3Cleave]]\n[[B) It cleaves complexed Factor B into Ba and the active fragment Bb|Alternative-Q2-Correct-CleaveB]]\n[[C) It cleaves and activates Factor H|Alternative-Q2-Incorrect-FactorH]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Alternative-Q2-Incorrect-C3Cleave": "<div class=\"section-label alternative\">Alternative Pathway</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> Factor D has a very narrow substrate specificity. It cannot cleave C3; it acts exclusively on Factor B.\n</div>\n[[← Try again|Alternative-C3H2O-FactorB]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Alternative-Q2-Incorrect-FactorH": "<div class=\"section-label alternative\">Alternative Pathway</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> Factor H is not cleaved during activation; it functions as a regulatory cofactor and decay accelerator.\n</div>\n[[← Try again|Alternative-C3H2O-FactorB]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Alternative-Q2-Correct-CleaveB": "<div class=\"section-label alternative\">Alternative Pathway</div>\n<div class=\"feedback-correct\">\n<strong>Correct!</strong> Factor D is a constitutively active serine protease that cleaves Factor B only when bound to C3(H2O) or C3b, releasing the small fragment Ba and leaving the active serine protease fragment <strong>Bb</strong> bound.\n</div>\n<div class=\"notice-box\"><strong>Safety Mechanism:</strong> Free Factor B cannot be cleaved by Factor D in solution; cleavage requires prior assembly with C3(H2O) or C3b.</div>\n[[Continue → Fluid-Phase C3 Convertase|Alternative-Initial-C3Convertase]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Alternative-Initial-C3Convertase": "<div class=\"section-label alternative\">Alternative Pathway</div>\n<div class=\"progress-label\">Alternative Pathway · Step 3 of 5</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:60%\"></div></div>\n\n<h2>The Fluid-Phase Initial Convertase: C3(H2O)Bb</h2>\n<p>The resulting complex <strong>C3(H2O)Bb</strong> is the short-lived initial fluid-phase C3 convertase. It continuously cleaves native C3 into C3a and C3b in the plasma.</p>\n\n<div class=\"diagram-container\"><img src=\"C'_Images/Slide5.1.png\" alt=\"Fluid-phase C3 convertase formation C3(H2O)Bb\" class=\"diagram-img\"></div>\n\n<p><em>Why is C3(H2O)Bb designated a \"fluid-phase\" convertase?</em></p>\n\n[[A) The enzymatic complex is dissolved in plasma rather than anchored to a surface|Alternative-Q3-Correct-Fluid]]\n[[B) It requires surrounding free water molecules to maintain its tertiary structure|Alternative-Q3-Incorrect-Water]]\n[[C) It is only capable of cleaving C3 in lymphatic fluid|Alternative-Q3-Incorrect-Lymph]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Alternative-Q3-Incorrect-Water": "<div class=\"section-label alternative\">Alternative Pathway</div>\n<div class=\"feedback-incorrect\">\n<strong>Not quite.</strong> Although C3 was initially hydrolysed by water, the term 'fluid-phase' refers specifically to the physical compartmentalisation of the enzyme freely floating in plasma rather than covalently anchored to a target cell.\n</div>\n[[← Try again|Alternative-Initial-C3Convertase]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Alternative-Q3-Incorrect-Lymph": "<div class=\"section-label alternative\">Alternative Pathway</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> Fluid-phase convertases circulate in blood plasma, interstitial fluid, and lymph alike.\n</div>\n[[← Try again|Alternative-Initial-C3Convertase]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Alternative-Q3-Correct-Fluid": "<div class=\"section-label alternative\">Alternative Pathway</div>\n<div class=\"feedback-correct\">\n<strong>Correct!</strong> It is called 'fluid-phase' because neither C3(H2O) nor Bb is anchored to a cell membrane. They generate active C3b in the microenvironment that can covalently tag any nearby surfaces.\n</div>\n[[Continue → C3b Deposition & Amplification|Alternative-C3b-Deposition]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Alternative-C3b-Deposition": "<div class=\"section-label alternative\">Alternative Pathway</div>\n<div class=\"progress-label\">Alternative Pathway · Step 4 of 5</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:80%\"></div></div>\n\n<h2>C3b Deposition and the Amplification Loop</h2>\n<p>C3b generated by fluid-phase cleavage exposes its reactive internal thioester bond. If a target is immediately adjacent, C3b covalently anchors to cell wall hydroxyl or amine groups.</p>\n<p>On host cells, membrane regulators (DAF, MCP) and soluble Factor H rapidly bind C3b and stop activation. But on foreign microbial surfaces lacking these regulators, C3b binds plasma Factor B, inviting Factor D cleavage and creating the <strong>surface-bound alternative pathway C3 convertase (C3bBb)</strong>. This triggers the powerful <strong>amplification loop</strong>.</p>\n\n[[Continue → Surface-Bound Convertase|Alternative-Surface-FactorB]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Alternative-Surface-FactorB": "<div class=\"section-label alternative\">Alternative Pathway</div>\n<div class=\"progress-label\">Alternative Pathway · Step 5 of 5</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:100%\"></div></div>\n\n<h2>Stabilisation of C3bBb by Properdin</h2>\n<p>The surface-bound convertase <strong>C3bBb</strong> has an intrinsic half-life of only ~90 seconds at body temperature before Bb dissociates irreversibly.</p>\n\n<div class=\"diagram-container\"><img src=\"C'_Images/Slide5.2.png\" alt=\"Surface-bound C3bBb convertase and Properdin stabilization\" class=\"diagram-img\"></div>\n\n<p><em>Which regulatory molecule acts as a positive regulator, binding to C3bBb and extending its functional half-life nearly tenfold?</em></p>\n\n[[A) CD59 (Protectin)|Alternative-Q4-Incorrect-CD59]]\n[[B) Factor H|Alternative-Q4-Incorrect-FactorH]]\n[[C) Properdin (Factor P)|Alternative-Q4-Correct-Properdin]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Alternative-Q4-Incorrect-CD59": "<div class=\"section-label alternative\">Alternative Pathway</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> CD59 is a membrane inhibitor that blocks the terminal Membrane Attack Complex by preventing C9 polymerization.\n</div>\n[[← Try again|Alternative-Surface-FactorB]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Alternative-Q4-Incorrect-FactorH": "<div class=\"section-label alternative\">Alternative Pathway</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> Factor H does the exact opposite: it is an essential <em>negative regulator</em> that displaces Bb (decay acceleration) and aids Factor I in destroying C3b.\n</div>\n[[← Try again|Alternative-Surface-FactorB]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Alternative-Q4-Correct-Properdin": "<div class=\"section-label alternative\">Alternative Pathway</div>\n<div class=\"feedback-correct\">\n<strong>Correct!</strong> <strong>Properdin (Factor P)</strong> is the only known positive regulator of complement. By binding the complex to form <strong>C3bBbP</strong>, it stabilizes the convertase, preventing spontaneous dissociation and promoting massive local amplification.\n</div>\n[[Continue → Alternative Pathway Summary|Alternative-Summary]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Alternative-Summary": "<div class=\"section-label alternative\">Alternative Pathway</div>\n<h2>Alternative Pathway: Summary</h2>\n<p>You have traced the alternative cascade from spontaneous tick-over to the fully stabilized surface C3 convertase.</p>\n\n<div class=\"key-box\">\n<strong>1. Spontaneous C3 Tick-Over:</strong> Slow C3 hydrolysis generates C3(H2O).<br>\n<strong>2. Initial Fluid-Phase Convertase:</strong> C3(H2O) + Factor B (cleaved by Factor D) → C3(H2O)Bb.<br>\n<strong>3. Surface Deposition:</strong> Nascent C3b forms covalent bonds on microbial surfaces.<br>\n<strong>4. Amplification Convertase:</strong> Surface C3b binds Factor B → cleaved by Factor D to form C3bBb.<br>\n<strong>5. Positive Regulation:</strong> Properdin binds C3bBb → stable <strong>C3bBbP</strong>.\n</div>\n\n[[Continue → Shared Convergence Steps|Shared-C3-Cleavage-From-Alternative]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Lectin-Intro": "<div class=\"section-label lectin\">Lectin Pathway</div>\n<div class=\"progress-label\">Lectin Pathway · Step 1 of 3</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:25%\"></div></div>\n\n<h2>Carbohydrate Pattern Recognition</h2>\n<p>The lectin pathway is triggered by soluble <strong>pattern recognition receptors</strong> binding repetitive arrayed carbohydrates on pathogen surfaces. Key recognition molecules include <strong>Mannose-Binding Lectin (MBL)</strong> and <strong>ficolins</strong>.</p>\n\n<div class=\"diagram-container\"><img src=\"C'_Images/Slide6.PNG\" alt=\"Lectin pathway MBL and MASP activation\" class=\"diagram-img\"></div>\n\n<p><em>Which microbial molecular structures are preferentially recognized by MBL?</em></p>\n\n[[A) Repeating mannose, fucose, and N-acetylglucosamine (GlcNAc) residues|Lectin-Q1-Correct-Sugars]]\n[[B) Lipopolysaccharide lipid A core domains|Lectin-Q1-Incorrect-LPS]]\n[[C) Sialic acid residues decorating mammalian cell membranes|Lectin-Q1-Incorrect-Sialic]]\n[[D) Unmethylated bacterial CpG DNA motifs|Lectin-Q1-Incorrect-CpG]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Lectin-Q1-Incorrect-LPS": "<div class=\"section-label lectin\">Lectin Pathway</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> Lipid A of LPS is primarily recognized by TLR4/MD-2 of the innate cellular system rather than MBL.\n</div>\n[[← Try again|Lectin-Intro]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Lectin-Q1-Incorrect-Sialic": "<div class=\"section-label lectin\">Lectin Pathway</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> Sialic acid residues are typical of host mammalian glycoproteins and act to recruit complement inhibitor Factor H, shielding host tissues.\n</div>\n[[← Try again|Lectin-Intro]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Lectin-Q1-Incorrect-CpG": "<div class=\"section-label lectin\">Lectin Pathway</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> Unmethylated CpG DNA motifs are recognised by endosomal Toll-like receptor 9 (TLR9), not MBL.\n</div>\n[[← Try again|Lectin-Intro]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Lectin-Q1-Correct-Sugars": "<div class=\"section-label lectin\">Lectin Pathway</div>\n<div class=\"feedback-correct\">\n<strong>Correct!</strong> MBL binds terminal mannose, fucose, and GlcNAc residues displayed on bacterial, fungal, and viral coats with precise spatial geometry, distinguishing them from host glycoproteins.\n</div>\n[[Continue → MASP Activation|Lectin-MASP-Activation]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Lectin-MASP-Activation": "<div class=\"section-label lectin\">Lectin Pathway</div>\n<div class=\"progress-label\">Lectin Pathway · Step 2 of 3</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:50%\"></div></div>\n\n<h2>Activation of MBL-Associated Serine Proteases</h2>\n<p>Circulating MBL and ficolins form complexes with zymogen proteases called MASPs (MASP-1, MASP-2, and MASP-3). Target binding triggers autoactivation of MASP-1, which subsequently activates MASP-2.</p>\n\n<p><em>Which enzyme is the primary catalytic effector that cleaves both C4 and C2?</em></p>\n\n[[A) MASP-1|Lectin-Q2-Incorrect-MASP1]]\n[[B) MASP-2|Lectin-Q2-Correct-MASP2]]\n[[C) MASP-3|Lectin-Q2-Incorrect-MASP3]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Lectin-Q2-Incorrect-MASP1": "<div class=\"section-label lectin\">Lectin Pathway</div>\n<div class=\"feedback-incorrect\">\n<strong>Not quite.</strong> MASP-1 auto-activates first and cleaves MASP-2 and C2, but it cannot efficiently cleave C4. Cleavage of both C4 and C2 is predominantly executed by active MASP-2.\n</div>\n[[← Try again|Lectin-MASP-Activation]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Lectin-Q2-Incorrect-MASP3": "<div class=\"section-label lectin\">Lectin Pathway</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> MASP-3 does not cleave C4/C2; emerging evidence implicates it in the resting activation of Factor D in the alternative pathway.\n</div>\n[[← Try again|Lectin-MASP-Activation]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Lectin-Q2-Correct-MASP2": "<div class=\"section-label lectin\">Lectin Pathway</div>\n<div class=\"feedback-correct\">\n<strong>Correct!</strong> <strong>MASP-2</strong> is the functional analogue of C1s. Once activated by MASP-1, MASP-2 efficiently cleaves C4 and then C2.\n</div>\n<div class=\"notice-box\"><strong>Key Analogy:</strong> MASP-2 in the lectin pathway performs the exact same biochemical tasks as C1s in the classical pathway.</div>\n[[Continue → Assembly of C4b2a|Lectin-C4-Cleavage]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Lectin-C4-Cleavage": "<div class=\"section-label lectin\">Lectin Pathway</div>\n<div class=\"progress-label\">Lectin Pathway · Step 3 of 3</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:75%\"></div></div>\n\n<h2>Cleavage of C4 and C2: Converging on C4b2a</h2>\n<p>MASP-2 cleaves C4 into C4a and C4b. C4b covalently attaches to the microbial surface. C2 then binds C4b and is cleaved by MASP-2 into C2b (released) and C2a (bound).</p>\n<p>The resulting complex <strong>C4b2a</strong> is the <strong>Lectin Pathway C3 Convertase</strong> — structurally and functionally identical to the Classical C3 Convertase.</p>\n\n[[Continue → Shared Convergence Steps|Shared-C3-Cleavage-From-Alternative]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Shared-C3-Cleavage-From-Alternative": "<div class=\"section-label shared\">Shared Steps</div>\n<div class=\"progress-label\">Shared Steps · Step 1 of 4</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:25%\"></div></div>\n\n<h2>C3 Cleavage: Central Hub of Complement</h2>\n<p>All three activation arms assemble functional C3 convertases on the target surface:</p>\n<div class=\"key-box\">\nClassical &amp; Lectin pathways: <strong>C4b2a</strong><br>\nAlternative pathway: <strong>C3bBbP</strong>\n</div>\n<p>These convertases cleave native C3 into:</p>\n<div class=\"key-box\">\n<strong>C3a</strong> — potent soluble anaphylatoxin causing mast cell degranulation &amp; chemotaxis<br>\n<strong>C3b</strong> — primary opsonin tagging targets for phagocytic CR1 receptors\n</div>\n\n<div class=\"diagram-container\"><img src=\"C'_Images/Slide4.5.PNG\" alt=\"Cleavage of C3 by the C3 convertase\" class=\"diagram-img\"></div>\n\n<p><em>Beyond direct opsonisation, what critical downstream cascade event is mediated by newly deposited C3b?</em></p>\n\n[[A) Binding to the C3 convertase to switch substrate specificity toward C5|Shared-Q1-Correct-C5Convertase]]\n[[B) Direct transmembrane insertion to form a lytic pore without other proteins|Shared-Q1-Incorrect-Pore]]\n[[C) Direct covalent inactivation of Factor H|Shared-Q1-Incorrect-FactorHInact]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Shared-Q1-Incorrect-Pore": "<div class=\"section-label shared\">Shared Steps</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> C3b has no pore-forming capacity. Membrane disruption requires assembly of the C5b-9 complex.\n</div>\n[[← Try again|Shared-C3-Cleavage-From-Alternative]]",

"Shared-Q1-Incorrect-FactorHInact": "<div class=\"section-label shared\">Shared Steps</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> C3b serves as a target substrate for Factor H and Factor I, rather than inactivating Factor H.\n</div>\n[[← Try again|Shared-C3-Cleavage-From-Alternative]]",

"Shared-Q1-Correct-C5Convertase": "<div class=\"section-label shared\">Shared Steps</div>\n<div class=\"feedback-correct\">\n<strong>Correct!</strong> When an extra C3b molecule associates with the C3 convertase (forming C4b2a3b or C3bBb3bP), it alters the enzyme's binding pocket, shifting its substrate affinity from C3 to <strong>C5</strong>.\n</div>\n[[Continue → Formation of C5 Convertases|Shared-C5-Convertase-Formation]]",

"Shared-C5-Convertase-Formation": "<div class=\"section-label shared\">Shared Steps</div>\n<div class=\"progress-label\">Shared Steps · Step 2 of 4</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:50%\"></div></div>\n\n<h2>The C5 Convertase Enzymes</h2>\n<p>Incorporation of C3b yields the C5 convertases:</p>\n<div class=\"key-box\">\nClassical / Lectin C5 Convertase: <strong>C4b2a3b</strong><br>\nAlternative C5 Convertase: <strong>C3bBb3bP</strong>\n</div>\n\n<div class=\"diagram-container\"><img src=\"C'_Images/Slide10.PNG\" alt=\"Formation of the C5 convertase\" class=\"diagram-img\"></div>\n\n<p><em>Which molecule serves as the direct substrate for these enzyme complexes?</em></p>\n\n[[A) Factor B|Shared-Q2-Incorrect-FactorB]]\n[[B) Native C5|Shared-Q2-Correct-C5]]\n[[C) Native C4|Shared-Q2-Incorrect-C4]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Shared-Q2-Incorrect-FactorB": "<div class=\"section-label shared\">Shared Steps</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> Factor B was utilized upstream in the alternative pathway; the substrate here is native C5.\n</div>\n[[← Try again|Shared-C5-Convertase-Formation]]",

"Shared-Q2-Incorrect-C4": "<div class=\"section-label shared\">Shared Steps</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> C4 is cleaved early in the classical/lectin cascade by C1s or MASP-2.\n</div>\n[[← Try again|Shared-C5-Convertase-Formation]]",

"Shared-Q2-Correct-C5": "<div class=\"section-label shared\">Shared Steps</div>\n<div class=\"feedback-correct\">\n<strong>Correct!</strong> The C5 convertase binds native C5, orienting it for targeted cleavage.\n</div>\n[[Continue → C5 Cleavage & Terminal Assembly|Shared-C5-Cleavage]]",

"Shared-C5-Cleavage": "<div class=\"section-label shared\">Shared Steps</div>\n<div class=\"progress-label\">Shared Steps · Step 3 of 4</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:75%\"></div></div>\n\n<h2>Cleavage of C5: Entering the Terminal Pathway</h2>\n<p>The C5 convertase cleaves C5 into two critically distinct products:</p>\n<div class=\"key-box\">\n<strong>C5a</strong> — the most potent anaphylatoxin and leukocyte chemoattractant in human biology<br>\n<strong>C5b</strong> — the labile foundation for assembly of the Membrane Attack Complex\n</div>\n\n<div class=\"diagram-container\"><img src=\"C'_Images/Slide11.PNG\" alt=\"Cleavage of C5 into C5a and C5b\" class=\"diagram-img\"></div>\n\n<p><em>Which statement regarding C5b is accurate?</em></p>\n\n[[A) It rapidly coordinates C6 binding to prevent inactivation (lacking an internal thioester bond)|Shared-Q3-Correct-C5bNoThio]]\n[[B) It forms a covalent bond to cell surfaces via an internal thioester bond|Shared-Q3-Incorrect-Thioester]]\n[[C) It diffuses into blood vessels to trigger basophil histamine release|Shared-Q3-Incorrect-Histamine]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Shared-Q3-Incorrect-Thioester": "<div class=\"section-label shared\">Shared Steps</div>\n<div class=\"feedback-incorrect\">\n<strong>Common misconception!</strong> Unlike C3b and C4b, <strong>C5b lacks an internal thioester bond</strong> and cannot bind covalently to target surfaces. It associates non-covalently with membranes via C7 and C8.\n</div>\n[[← Try again|Shared-C5-Cleavage]]",

"Shared-Q3-Incorrect-Histamine": "<div class=\"section-label shared\">Shared Steps</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> That is the role of C5a, the soluble anaphylatoxin fragment.\n</div>\n[[← Try again|Shared-C5-Cleavage]]",

"Shared-Q3-Correct-C5bNoThio": "<div class=\"section-label shared\">Shared Steps</div>\n<div class=\"feedback-correct\">\n<strong>Correct!</strong> C5b undergoes rapid thermal inactivation unless it immediately binds soluble <strong>C6</strong>, initiating non-covalent assembly of the terminal complex.\n</div>\n[[Continue → MAC Assembly|Shared-MAC-C5b6]]",

"Shared-MAC-C5b6": "<div class=\"section-label shared\">Shared Steps</div>\n<div class=\"progress-label\">Shared Steps · Step 4 of 4 — MAC Assembly</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:100%\"></div></div>\n\n<h2>Assembly of the Membrane Attack Complex (MAC)</h2>\n<p>The terminal components assemble sequentially without further proteolysis:</p>\n<div class=\"key-box\">\n1. <strong>C5b + C6</strong> → stable soluble C5b-6<br>\n2. <strong>+ C7</strong> → C5b-7 exposes a hydrophobic hairpin and embeds into the outer membrane leaflet<br>\n3. <strong>+ C8</strong> → C5b-8 integrates across the lipid bilayer, creating a tiny leak (10 Å)<br>\n4. <strong>+ 12–18 molecules of C9</strong> → C9 polymerises into a stable transmembrane pore (100 Å diameter)\n</div>\n\n<div class=\"diagram-container\"><img src=\"C'_Images/Slide12.PNG\" alt=\"Membrane Attack Complex Assembly\" class=\"diagram-img\"></div>\n\n<p><em>What is the primary biophysical mechanism by which C5b-9 destroys target cells?</em></p>\n\n[[A) Intracellular activation of bacterial caspase-like enzymes|Shared-Q4-Incorrect-Caspase]]\n[[B) Enzymatic digestion of outer membrane peptidoglycan|Shared-Q4-Incorrect-Enzymatic]]\n[[C) Disruption of the osmotic gradient leading to influx of water, cell swelling, and lysis|Shared-Q4-Correct-Osmotic]]\n\n<div class=\"menu-exit-container\">\n[[🏠 Return to Main Menu|Start-Complement]]\n</div>",

"Shared-Q4-Incorrect-Caspase": "<div class=\"section-label shared\">Shared Steps</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> The MAC does not act via apoptotic signalling in bacteria; its mechanism is purely biophysical.\n</div>\n[[← Try again|Shared-MAC-C5b6]]",

"Shared-Q4-Incorrect-Enzymatic": "<div class=\"section-label shared\">Shared Steps</div>\n<div class=\"feedback-incorrect\">\n<strong>Incorrect.</strong> MAC components are non-enzymatic structural pore-formers; lysozyme digests peptidoglycan, not the MAC.\n</div>\n[[← Try again|Shared-MAC-C5b6]]",

"Shared-Q4-Correct-Osmotic": "<div class=\"section-label shared\">Shared Steps</div>\n<div class=\"feedback-correct\">\n<strong>Correct!</strong> The stable 10 nm hydrophilic pore permits free diffusion of water, ions, and solutes across the membrane. Intracellular osmotic pressure drives rapid influx of water, culminating in osmotic rupture.\n</div>\n[[Continue → Pathway Summary|Complement-Summary]]",

"Complement-Summary": "<div class=\"section-label shared\">Summary</div>\n<h2>Complement Activation: Key Outcomes</h2>\n<p>Congratulations — you have traced complement activation from recognition through to terminal lysis!</p>\n\n<div class=\"diagram-container\"><img src=\"C'_Images/Slide13.PNG\" alt=\"Summary of complement activation outcomes\" class=\"diagram-img\"></div>\n\n<div class=\"key-box\">\n<strong>Four Major Effector Outcomes:</strong><br>\n1. <strong>Opsonisation:</strong> C3b, iC3b, and C4b tag surfaces for phagocytosis via macrophage/neutrophil CR1 and CR3.<br>\n2. <strong>Chemotaxis &amp; Inflammation:</strong> Anaphylatoxins C5a &gt; C3a &gt; C4a recruit leukocytes and induce microvascular leakage.<br>\n3. <strong>Direct Lysis:</strong> The Membrane Attack Complex (C5b-9) punches transmembrane pores in susceptible Gram-negative bacteria.<br>\n4. <strong>Immune Complex Clearance:</strong> C3b/C4b coating enables erythrocyte CR1 binding for hepatic and splenic disposal.\n</div>\n\n[[Explore Complement Regulation|Regulation_Intro]]\n[[Return to Main Menu|Start-Complement]]",

"Regulation_Intro": "<div class=\"section-label regulation\">Regulation</div>\n<div class=\"progress-label\">Regulation · Step 1 of 4</div>\n<div class=\"progress-bar\"><div class=\"progress-fill\" style=\"width:25%\"></div></div>\n\n<h2>Complement Regulation: Safeguarding Host Cells</h2>\n<p>Because the complement cascade involves exponential enzymatic amplification and spontaneous tick-over, strict regulatory control is vital to spare bystander host tissues from inflammatory and lytic destruction.</p>\n\n<p><em>What is the primary evolutionary reason host cells express membrane-bound complement regulators?</em></p>\n\n[[A) To shut down active convertases and block MAC assembly on self-membranes|Regulation_Q1_Correct_SelfDefense]]\n[[B) To divert complement consumption exclusively toward red blood cells|Regulation_Q1_Incorrect_RBC]]\n[[C) To completely prevent antibodies from binding to bacterial pathogens
